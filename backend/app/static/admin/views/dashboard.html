<!-- VIEW: DASHBOARD -->
<div x-show="activeTab === 'dashboard'" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" class="space-y-6 select-none">
    
    <!-- TOP 3 METRIC CARDS (TO'LIQ 1X1 KVADRAT O'LCHAM) -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 max-w-5xl">
        
        <!-- 1. JAMI MAKTABLAR (1x1 Kvadrat Indikator) -->
        <div class="glass-card aspect-square p-6 rounded-2xl border border-neutral-800/80 bg-neutral-950/40 flex flex-col justify-between hover:border-neutral-700 hover:bg-neutral-900/30 transition relative overflow-hidden group shadow-lg"
             style="aspect-ratio: 1 / 1;">
            <!-- Ambient Glow -->
            <div class="absolute -top-12 -right-12 w-28 h-28 bg-indigo-500/10 rounded-full blur-2xl pointer-events-none group-hover:bg-indigo-500/15 transition"></div>

            <!-- Top Header -->
            <div class="flex items-center justify-between relative z-10">
                <div>
                    <span class="text-[11px] font-semibold text-neutral-400 uppercase tracking-wider block">Jami Maktablar</span>
                    <span class="text-[10px] text-neutral-500 font-mono">Tizimdagi muassasalar</span>
                </div>
                <div class="w-10 h-10 rounded-xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center border border-indigo-500/20 text-base shadow-sm">
                    <i class="fas fa-school"></i>
                </div>
            </div>

            <!-- Center / Number Counter -->
            <div class="my-auto py-2 relative z-10">
                <div class="flex items-baseline gap-2">
                    <h3 class="text-4xl sm:text-5xl font-black text-white font-mono tracking-tight" x-text="stats.schools_count || (schoolsDetailed?.length || 0)">0</h3>
                    <span class="text-xs text-neutral-500 font-mono">ta</span>
                </div>
                <div class="mt-2.5 inline-flex items-center gap-1.5 px-2 py-0.5 rounded-md bg-emerald-500/10 border border-emerald-500/20 text-[10px] text-emerald-400 font-mono font-medium">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    Faol integratsiya
                </div>
            </div>

            <!-- Bottom Subtext -->
            <div class="pt-3 border-t border-neutral-800/80 flex items-center justify-between text-[11px] text-neutral-400 relative z-10">
                <span>Yagona monitoring</span>
                <span class="text-neutral-500 font-mono">100%</span>
            </div>
        </div>

        <!-- 2. JAMI O'QUVCHILAR (1x1 Kvadrat Indikator - 2 Guruh: O'g'il va Qiz Bolalar) -->
        <div class="glass-card aspect-square p-6 rounded-2xl border border-neutral-800/80 bg-neutral-950/40 flex flex-col justify-between hover:border-neutral-700 hover:bg-neutral-900/30 transition relative overflow-hidden group shadow-lg"
             style="aspect-ratio: 1 / 1;">
            <!-- Ambient Glow -->
            <div class="absolute -top-12 -right-12 w-28 h-28 bg-sky-500/10 rounded-full blur-2xl pointer-events-none group-hover:bg-sky-500/15 transition"></div>

            <!-- Top Header -->
            <div class="flex items-center justify-between relative z-10">
                <div>
                    <span class="text-[11px] font-semibold text-neutral-400 uppercase tracking-wider block">Jami O'quvchilar</span>
                    <span class="text-[10px] text-neutral-500 font-mono">Umumiy kontingent</span>
                </div>
                <div class="w-10 h-10 rounded-xl bg-sky-500/10 text-sky-400 flex items-center justify-center border border-sky-500/20 text-base shadow-sm">
                    <i class="fas fa-user-graduate"></i>
                </div>
            </div>

            <!-- Main Counter -->
            <div class="my-auto py-1 relative z-10">
                <div class="flex items-baseline gap-2">
                    <h3 class="text-4xl sm:text-5xl font-black text-white font-mono tracking-tight" x-text="stats.students_count || 0">0</h3>
                    <span class="text-xs text-neutral-500 font-mono">nafar</span>
                </div>
            </div>

            <!-- 2 Guruh: O'g'il bolalar va Qiz bolalar (Square Bottom Grid) -->
            <div class="grid grid-cols-2 gap-2 pt-3 border-t border-neutral-800/80 relative z-10">
                <!-- O'g'il bolalar -->
                <div class="p-2 rounded-xl bg-neutral-900/70 border border-neutral-800/80 flex items-center justify-between">
                    <div class="flex items-center gap-1.5 min-w-0">
                        <div class="w-5 h-5 rounded-md bg-blue-500/15 text-blue-400 flex items-center justify-center text-[10px] flex-shrink-0">
                            <i class="fas fa-mars"></i>
                        </div>
                        <span class="text-[10px] text-neutral-400 truncate">O'g'il</span>
                    </div>
                    <span class="text-xs font-bold text-white font-mono ml-1" x-text="stats.boys_count || 0">0</span>
                </div>

                <!-- Qiz bolalar -->
                <div class="p-2 rounded-xl bg-neutral-900/70 border border-neutral-800/80 flex items-center justify-between">
                    <div class="flex items-center gap-1.5 min-w-0">
                        <div class="w-5 h-5 rounded-md bg-pink-500/15 text-pink-400 flex items-center justify-center text-[10px] flex-shrink-0">
                            <i class="fas fa-venus"></i>
                        </div>
                        <span class="text-[10px] text-neutral-400 truncate">Qiz</span>
                    </div>
                    <span class="text-xs font-bold text-white font-mono ml-1" x-text="stats.girls_count || 0">0</span>
                </div>
            </div>
        </div>

        <!-- 3. JAMI KAMERALAR (1x1 Kvadrat Indikator) -->
        <div class="glass-card aspect-square p-6 rounded-2xl border border-neutral-800/80 bg-neutral-950/40 flex flex-col justify-between hover:border-neutral-700 hover:bg-neutral-900/30 transition relative overflow-hidden group shadow-lg"
             style="aspect-ratio: 1 / 1;">
            <!-- Ambient Glow -->
            <div class="absolute -top-12 -right-12 w-28 h-28 bg-emerald-500/10 rounded-full blur-2xl pointer-events-none group-hover:bg-emerald-500/15 transition"></div>

            <!-- Top Header -->
            <div class="flex items-center justify-between relative z-10">
                <div>
                    <span class="text-[11px] font-semibold text-neutral-400 uppercase tracking-wider block">Jami Kameralar</span>
                    <span class="text-[10px] text-neutral-500 font-mono">Turniket & Face ID</span>
                </div>
                <div class="w-10 h-10 rounded-xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center border border-emerald-500/20 text-base shadow-sm">
                    <i class="fas fa-video"></i>
                </div>
            </div>

            <!-- Center / Number Counter -->
            <div class="my-auto py-2 relative z-10">
                <div class="flex items-baseline gap-2">
                    <h3 class="text-4xl sm:text-5xl font-black text-white font-mono tracking-tight" x-text="devices?.length || stats.devices_count || 0">0</h3>
                    <span class="text-xs text-neutral-500 font-mono">dona</span>
                </div>
                <div class="mt-2.5 inline-flex items-center gap-1.5 px-2 py-0.5 rounded-md bg-emerald-500/10 border border-emerald-500/20 text-[10px] text-emerald-400 font-mono font-medium">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
                    Online oqim
                </div>
            </div>

            <!-- Bottom Subtext -->
            <div class="pt-3 border-t border-neutral-800/80 flex items-center justify-between text-[11px] text-neutral-400 relative z-10">
                <span>Faol qurilmalar</span>
                <span class="text-emerald-400 font-mono font-semibold" x-text="(devices?.length || stats.devices_count || 0) + ' online'">0 online</span>
            </div>
        </div>

    </div>

</div>
