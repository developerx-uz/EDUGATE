<!-- VIEW: PARENTS -->
<div x-show="activeTab === 'parents'" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" class="space-y-6">
    <div>
        <h2 class="text-xl font-bold text-white flex items-center gap-2">
            <i class="fas fa-users text-indigo-400"></i>
            Ota-onalar Ro'yxati
        </h2>
        <p class="text-xs text-slate-400 mt-0.5">Telegram Bot orqali tizimga ulangan ota-onalar va ularning farzandlari</p>
    </div>

    <!-- Quick Stats -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div class="glass-card p-4 rounded-2xl flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-lg">
                <i class="fas fa-users"></i>
            </div>
            <div>
                <p class="text-[11px] text-slate-400">Jami Ota-onalar</p>
                <h4 class="text-xl font-bold text-white" x-text="parents.length"></h4>
            </div>
        </div>
        <div class="glass-card p-4 rounded-2xl flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-lg">
                <i class="fab fa-telegram"></i>
            </div>
            <div>
                <p class="text-[11px] text-slate-400">Telegram Ulangan</p>
                <h4 class="text-xl font-bold text-emerald-400" x-text="parents.filter(p => p.telegram_chat_id).length"></h4>
            </div>
        </div>
        <div class="glass-card p-4 rounded-2xl flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-purple-500/20 text-purple-400 flex items-center justify-center text-lg">
                <i class="fas fa-child"></i>
            </div>
            <div>
                <p class="text-[11px] text-slate-400">Biriktirilgan Farzandlar</p>
                <h4 class="text-xl font-bold text-purple-400" x-text="stats.students_count || 0"></h4>
            </div>
        </div>
    </div>

    <!-- Parents Table -->
    <div class="glass-card rounded-2xl overflow-hidden shadow-xl border border-slate-800">
        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm">
                <thead class="bg-slate-800/80 text-slate-400 text-xs uppercase font-semibold border-b border-slate-800">
                    <tr>
                        <th class="px-6 py-4">#</th>
                        <th class="px-6 py-4">Ota-ona</th>
                        <th class="px-6 py-4">Telefon Raqami</th>
                        <th class="px-6 py-4">Telegram Chat ID</th>
                        <th class="px-6 py-4">Farzandlari</th>
                        <th class="px-6 py-4 text-right">Status</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-800/50">
                    <template x-for="(p, idx) in parents" :key="p.id">
                        <tr class="hover:bg-slate-800/30 transition">
                            <td class="px-6 py-4 text-slate-500 text-xs" x-text="idx + 1"></td>
                            <td class="px-6 py-4">
                                <div class="flex items-center gap-3">
                                    <div class="w-9 h-9 rounded-xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-sm font-bold"
                                         x-text="p.full_name ? p.full_name.charAt(0) : 'O'"></div>
                                    <span class="font-semibold text-white" x-text="p.full_name || 'Ism kiritilmagan'"></span>
                                </div>
                            </td>
                            <td class="px-6 py-4 font-mono text-indigo-400 font-bold text-xs" x-text="p.phone_number"></td>
                            <td class="px-6 py-4 font-mono text-xs text-slate-400" x-text="p.telegram_chat_id || 'Ulanmagan'"></td>
                            <td class="px-6 py-4 text-xs text-slate-300" x-text="(p.students && p.students.length) ? p.students.join(', ') : 'Bog\'lanmagan'"></td>
                            <td class="px-6 py-4 text-right">
                                <span x-show="p.telegram_chat_id" class="px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs font-semibold">
                                    Faol
                                </span>
                                <span x-show="!p.telegram_chat_id" class="px-2.5 py-1 rounded-full bg-slate-800 text-slate-500 text-xs">
                                    Kutilmoqda
                                </span>
                            </td>
                        </tr>
                    </template>
                    <tr x-show="parents.length === 0">
                        <td colspan="6" class="px-6 py-12 text-center text-slate-500 text-xs">
                            <i class="fas fa-users-slash text-3xl mb-2 block opacity-30"></i>
                            Telegram bot orqali ro'yxatdan o'tgan ota-onalar hozircha yo'q
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
