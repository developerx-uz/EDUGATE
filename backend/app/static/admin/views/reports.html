<!-- VIEW: REPORTS -->
<div x-show="activeTab === 'reports'" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" class="space-y-6">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
            <h2 class="text-xl font-bold text-white flex items-center gap-2">
                <i class="fas fa-chart-line text-indigo-400"></i>
                Hisobotlar va Tahliliy Statistika
            </h2>
            <p class="text-xs text-slate-400 mt-0.5">Viloyat va shahar hokimligi uchun umumlashtirilgan tahliliy hisobotlar</p>
        </div>
        <div class="flex items-center gap-2">
            <button @click="exportReport('pdf')" class="px-3.5 py-2 bg-rose-600/20 hover:bg-rose-600/30 text-rose-300 rounded-xl text-xs font-semibold border border-rose-500/30 transition flex items-center gap-1.5">
                <i class="fas fa-print"></i> PDF Chop Etish
            </button>
            <button @click="exportReport('excel')" class="px-3.5 py-2 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 rounded-xl text-xs font-semibold border border-emerald-500/30 transition flex items-center gap-1.5 shadow-lg shadow-emerald-950/40">
                <i class="fas fa-file-excel"></i> Haqiqiy Excel (CSV) Yuklash
            </button>
        </div>
    </div>

    <!-- Report Type Tabs -->
    <div class="flex gap-2">
        <button @click="reportType = 'daily'" :class="reportType === 'daily' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'bg-slate-800 text-slate-400 hover:text-white'" class="px-4 py-2 rounded-xl text-xs font-semibold transition">
            <i class="fas fa-calendar-day mr-1"></i> Kunlik Davomat
        </button>
        <button @click="reportType = 'weekly'" :class="reportType === 'weekly' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'bg-slate-800 text-slate-400 hover:text-white'" class="px-4 py-2 rounded-xl text-xs font-semibold transition">
            <i class="fas fa-calendar-week mr-1"></i> Haftalik Tahlil
        </button>
        <button @click="reportType = 'monthly'" :class="reportType === 'monthly' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'bg-slate-800 text-slate-400 hover:text-white'" class="px-4 py-2 rounded-xl text-xs font-semibold transition">
            <i class="fas fa-calendar-alt mr-1"></i> Oylik Dinamika
        </button>
    </div>

    <!-- Report Content -->
    <div class="glass-card p-6 rounded-2xl space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="p-4 bg-slate-900/60 rounded-xl border border-slate-800">
                <p class="text-xs text-slate-400">Umumiy Davomat Ko'rsatkichi</p>
                <h3 class="text-2xl font-extrabold text-emerald-400 mt-1"
                    x-text="stats.students_count > 0 ? ((stats.today_entries / stats.students_count) * 100).toFixed(1) + '%' : '0%'"></h3>
                <p class="text-[11px] text-slate-400 mt-0.5">O'quvchilar soniga nisbatan</p>
            </div>
            <div class="p-4 bg-slate-900/60 rounded-xl border border-slate-800">
                <p class="text-xs text-slate-400">Bugungi Kechikishlar</p>
                <h3 class="text-2xl font-extrabold text-amber-400 mt-1" x-text="stats.today_lates"></h3>
                <p class="text-[11px] text-slate-400 mt-0.5">Dars boshlanishidan keyin kirganlar</p>
            </div>
            <div class="p-4 bg-slate-900/60 rounded-xl border border-slate-800">
                <p class="text-xs text-slate-400">Namunali Maktablar</p>
                <h3 class="text-lg font-extrabold text-indigo-400 mt-1 truncate" x-text="schoolsDetailed[0]?.name || 'Maktab kiritilmagan'"></h3>
                <p class="text-[11px] text-indigo-300 mt-0.5" x-text="schoolsDetailed[0]?.code || ''"></p>
            </div>
        </div>

        <div class="pt-4 border-t border-slate-800">
            <h4 class="text-sm font-bold text-white mb-3">Maktablar Kesimida Davomat Nisbati</h4>
            <div class="space-y-4">
                <template x-for="sc in schoolsDetailed" :key="sc.id">
                    <div class="space-y-1.5">
                        <div class="flex items-center justify-between text-xs">
                            <span class="font-semibold text-slate-300" x-text="sc.name"></span>
                            <span class="font-bold text-indigo-400" x-text="(sc.students_count || 0) + ' o\'quvchi'"></span>
                        </div>
                        <div class="w-full h-2.5 bg-slate-800 rounded-full overflow-hidden">
                            <div class="h-full bg-gradient-to-r from-indigo-500 to-emerald-400 rounded-full"
                                 :style="'width: ' + Math.min(100, Math.max(15, (sc.students_count || 0) * 10)) + '%'"></div>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>
</div>
