<!-- VIEW: ATTENDANCE -->
<div x-show="activeTab === 'attendance'" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" class="space-y-6">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
            <h2 class="text-xl font-bold text-white flex items-center gap-2">
                <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
                Jonli Davomat Monitoringi
            </h2>
            <p class="text-xs text-slate-400 mt-0.5">Kameralar va turniketlardan real vaqt rejimida kelayotgan signallar</p>
        </div>
        <div class="flex items-center gap-3">
            <label class="flex items-center gap-2 text-xs text-slate-400 cursor-pointer">
                <input type="checkbox" x-model="autoRefresh" class="rounded bg-slate-800 border-slate-700 text-indigo-600 focus:ring-indigo-500">
                Avto-yangilash (5s)
            </label>
            <button @click="fetchTodayLogs()" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-semibold border border-slate-700 transition flex items-center gap-1.5">
                <i class="fas fa-rotate-right"></i> Yangilash
            </button>
        </div>
    </div>

    <!-- Quick Stats -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="glass-card p-4 rounded-2xl flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-lg">
                <i class="fas fa-clipboard-user"></i>
            </div>
            <div>
                <p class="text-[11px] text-slate-400">Jami Hodisalar</p>
                <h4 class="text-xl font-bold text-white" x-text="todayLogs.length"></h4>
            </div>
        </div>
        <div class="glass-card p-4 rounded-2xl flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-lg">
                <i class="fas fa-clock-check"></i>
            </div>
            <div>
                <p class="text-[11px] text-slate-400">O'z Vaqtida</p>
                <h4 class="text-xl font-bold text-emerald-400" x-text="onTimeCount"></h4>
            </div>
        </div>
        <div class="glass-card p-4 rounded-2xl flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center text-lg">
                <i class="fas fa-clock"></i>
            </div>
            <div>
                <p class="text-[11px] text-slate-400">Kechikkanlar</p>
                <h4 class="text-xl font-bold text-amber-400" x-text="lateCount"></h4>
            </div>
        </div>
        <div class="glass-card p-4 rounded-2xl flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-blue-500/20 text-blue-400 flex items-center justify-center text-lg">
                <i class="fas fa-arrow-right-from-bracket"></i>
            </div>
            <div>
                <p class="text-[11px] text-slate-400">Chiqishlar</p>
                <h4 class="text-xl font-bold text-blue-400" x-text="exitCount"></h4>
            </div>
        </div>
    </div>

    <!-- Attendance Filters -->
    <div class="glass-card p-4 rounded-2xl">
        <div class="grid grid-cols-1 sm:grid-cols-4 gap-3">
            <div>
                <label class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Sana</label>
                <input type="date" x-model="attendanceDate" class="w-full px-3 py-2 bg-slate-800/80 border border-slate-700/60 rounded-xl text-white text-xs focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Maktab</label>
                <select x-model="attendanceFilter.school_id" class="w-full px-3 py-2 bg-slate-800/80 border border-slate-700/60 rounded-xl text-white text-xs focus:outline-none focus:border-indigo-500">
                    <option value="">Barcha maktablar</option>
                    <template x-for="sc in schoolsDetailed" :key="sc.id">
                        <option :value="sc.id" x-text="sc.name"></option>
                    </template>
                </select>
            </div>
            <div>
                <label class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Holati</label>
                <select x-model="attendanceFilter.status" class="w-full px-3 py-2 bg-slate-800/80 border border-slate-700/60 rounded-xl text-white text-xs focus:outline-none focus:border-indigo-500">
                    <option value="">Hammasi</option>
                    <option value="ON_TIME">O'z vaqtida</option>
                    <option value="LATE">Kechikkan</option>
                </select>
            </div>
            <div>
                <label class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Sinf</label>
                <input type="text" x-model="attendanceFilter.class_name" placeholder="Masalan: 8-B"
                       class="w-full px-3 py-2 bg-slate-800/80 border border-slate-700/60 rounded-xl text-white text-xs placeholder-slate-500 focus:outline-none focus:border-indigo-500">
            </div>
        </div>
    </div>

    <!-- Attendance Table -->
    <div class="glass-card rounded-2xl overflow-hidden shadow-xl border border-slate-800">
        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm">
                <thead class="bg-slate-800/80 text-slate-400 text-xs uppercase font-semibold border-b border-slate-800">
                    <tr>
                        <th class="px-6 py-4">O'quvchi</th>
                        <th class="px-6 py-4">Sinf</th>
                        <th class="px-6 py-4">Hodisa</th>
                        <th class="px-6 py-4">Holati</th>
                        <th class="px-6 py-4">Vaqti</th>
                        <th class="px-6 py-4">Aniqlik</th>
                        <th class="px-6 py-4 text-right">Telegram</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-800/50">
                    <template x-for="log in filteredLogs" :key="log.id">
                        <tr class="hover:bg-slate-800/30 transition">
                            <td class="px-6 py-4">
                                <div class="flex items-center gap-3">
                                    <div class="w-8 h-8 rounded-lg bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-xs font-bold"
                                         x-text="log.student_name ? log.student_name.charAt(0) : '?'"></div>
                                    <span class="font-semibold text-white" x-text="log.student_name"></span>
                                </div>
                            </td>
                            <td class="px-6 py-4">
                                <span class="px-2.5 py-1 rounded-lg bg-slate-800 border border-slate-700 text-xs font-bold text-slate-300" x-text="log.class_name"></span>
                            </td>
                            <td class="px-6 py-4">
                                <span x-show="log.event_type === 'ENTRY'" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs font-semibold">
                                    <i class="fas fa-arrow-right-to-bracket text-[10px]"></i> Kirish
                                </span>
                                <span x-show="log.event_type === 'EXIT'" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20 text-xs font-semibold">
                                    <i class="fas fa-arrow-right-from-bracket text-[10px]"></i> Chiqish
                                </span>
                            </td>
                            <td class="px-6 py-4">
                                <span x-show="log.status === 'ON_TIME'" class="px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs font-semibold">
                                    O'z vaqtida
                                </span>
                                <span x-show="log.status === 'LATE'" class="px-2.5 py-1 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20 text-xs font-semibold">
                                    Kechikkan
                                </span>
                            </td>
                            <td class="px-6 py-4 text-slate-400 text-xs font-mono" x-text="formatDate(log.event_time)"></td>
                            <td class="px-6 py-4 text-xs font-mono text-indigo-400" x-text="(log.confidence ? (log.confidence * 100).toFixed(0) : 98) + '%'"></td>
                            <td class="px-6 py-4 text-right">
                                <span x-show="log.is_notified" class="text-xs text-emerald-400 font-semibold inline-flex items-center gap-1">
                                    <i class="fas fa-check-double"></i> Yuborildi
                                </span>
                                <span x-show="!log.is_notified" class="text-xs text-slate-500">Kutilmoqda</span>
                            </td>
                        </tr>
                    </template>
                    <tr x-show="filteredLogs.length === 0">
                        <td colspan="7" class="px-6 py-12 text-center text-slate-500 text-xs">
                            <i class="fas fa-clipboard-check text-3xl mb-2 block opacity-30"></i>
                            Tanlangan filtr bo'yicha davomat loglari mavjud emas
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
