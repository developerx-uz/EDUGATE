<!-- VIEW: STUDENTS -->
<div x-show="activeTab === 'students'" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" class="space-y-6">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
            <h2 class="text-xl font-bold text-white flex items-center gap-2">
                <i class="fas fa-user-graduate text-indigo-400"></i>
                O'quvchilar Boshqaruvi
            </h2>
            <p class="text-xs text-slate-400 mt-0.5">Barcha maktablar va sinflar bo'yicha o'quvchilar kontingenti</p>
        </div>
        <button @click="openStudentModal()" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold shadow-lg shadow-indigo-600/30 flex items-center gap-2 transition">
            <i class="fas fa-plus"></i> Yangi O'quvchi
        </button>
    </div>

    <!-- Filters -->
    <div class="glass-card p-4 rounded-2xl">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
            <div>
                <label class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Qidirish</label>
                <div class="relative">
                    <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                    <input type="text" x-model="studentsFilter.search" placeholder="Ism, familiya, kod, PINFL..."
                           class="w-full pl-9 pr-3 py-2 bg-slate-800/80 border border-slate-700/60 rounded-xl text-white placeholder-slate-500 text-xs focus:outline-none focus:border-indigo-500">
                </div>
            </div>
            <div>
                <label class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Maktab</label>
                <select x-model="studentsFilter.school_id" class="w-full px-3 py-2 bg-slate-800/80 border border-slate-700/60 rounded-xl text-white text-xs focus:outline-none focus:border-indigo-500">
                    <option value="">Barcha maktablar</option>
                    <template x-for="sc in schoolsDetailed" :key="sc.id">
                        <option :value="sc.id" x-text="sc.name"></option>
                    </template>
                </select>
            </div>
            <div>
                <label class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Sinf</label>
                <input type="text" x-model="studentsFilter.class_name" placeholder="Masalan: 7-A"
                       class="w-full px-3 py-2 bg-slate-800/80 border border-slate-700/60 rounded-xl text-white placeholder-slate-500 text-xs focus:outline-none focus:border-indigo-500">
            </div>
            <div class="flex items-end">
                <button @click="fetchAllStudents()" class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-indigo-400 font-semibold rounded-xl text-xs border border-indigo-500/20 transition flex items-center justify-center gap-1.5">
                    <i class="fas fa-filter"></i> Filtrlash
                </button>
            </div>
        </div>
    </div>

    <!-- Students Table -->
    <div class="glass-card rounded-2xl overflow-hidden shadow-xl border border-slate-800">
        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm">
                <thead class="bg-slate-800/80 text-slate-400 text-xs uppercase font-semibold border-b border-slate-800">
                    <tr>
                        <th class="px-6 py-4">#</th>
                        <th class="px-6 py-4">O'quvchi</th>
                        <th class="px-6 py-4">Maktab</th>
                        <th class="px-6 py-4">Sinf</th>
                        <th class="px-6 py-4">O'quvchi Kodi</th>
                        <th class="px-6 py-4">RFID Karta</th>
                        <th class="px-6 py-4">Face ID</th>
                        <th class="px-6 py-4 text-right">Amallar</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-800/50">
                    <template x-for="(st, idx) in paginatedStudents" :key="st.id">
                        <tr class="hover:bg-slate-800/30 transition">
                            <td class="px-6 py-4 text-slate-500 text-xs" x-text="((studentsPage - 1) * 15) + idx + 1"></td>
                            <td class="px-6 py-4">
                                <div class="flex items-center gap-3">
                                    <div class="w-9 h-9 rounded-xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-sm font-bold border border-indigo-500/20"
                                         x-text="(st.first_name ? st.first_name.charAt(0) : (st.full_name ? st.full_name.charAt(0) : '?'))"></div>
                                    <div>
                                        <p class="font-semibold text-white text-sm" x-text="st.full_name || (st.first_name + ' ' + st.last_name)"></p>
                                        <p class="text-[11px] text-slate-500" x-text="st.pinfl ? ('JSHSHIR: ' + st.pinfl) : 'JSHSHIR yo\'q'"></p>
                                    </div>
                                </div>
                            </td>
                            <td class="px-6 py-4 text-xs text-slate-300" x-text="st.school_name || getSchoolName(st.school_id) || '-'"></td>
                            <td class="px-6 py-4">
                                <span class="px-2.5 py-1 rounded-lg bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 font-bold text-xs" x-text="st.class_name"></span>
                            </td>
                            <td class="px-6 py-4 font-mono text-xs text-slate-400" x-text="st.student_code"></td>
                            <td class="px-6 py-4 font-mono text-xs text-slate-400" x-text="st.rfid_card_id || '-'"></td>
                            <td class="px-6 py-4">
                                <span x-show="st.has_face_encoding || st.face_encoding" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs font-semibold">
                                    <i class="fas fa-check-circle"></i> Ulangan
                                </span>
                                <span x-show="!st.has_face_encoding && !st.face_encoding" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-slate-800 text-slate-500 text-xs">
                                    Yo'q
                                </span>
                            </td>
                            <td class="px-6 py-4 text-right">
                                <div class="flex items-center justify-end gap-2">
                                    <button @click="openEditStudentModal(st)" class="p-1.5 text-slate-400 hover:text-indigo-400 transition" title="Tahrirlash">
                                        <i class="fas fa-pen-to-square"></i>
                                    </button>
                                    <button @click="deleteStudent(st.id)" class="p-1.5 text-slate-400 hover:text-rose-400 transition" title="O'chirish">
                                        <i class="fas fa-trash-can"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </template>
                    <tr x-show="filteredStudents.length === 0">
                        <td colspan="8" class="px-6 py-12 text-center text-slate-500 text-xs">
                            <i class="fas fa-user-graduate text-3xl mb-2 block opacity-30"></i>
                            Hech qanday o'quvchi topilmadi
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="flex items-center justify-between px-6 py-4 border-t border-slate-800">
            <span class="text-xs text-slate-400" x-text="'Jami: ' + filteredStudents.length + ' ta o\'quvchi'"></span>
            <div class="flex items-center gap-2">
                <button @click="studentsPage > 1 && studentsPage--" :disabled="studentsPage <= 1" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs disabled:opacity-40 transition">
                    <i class="fas fa-chevron-left mr-1"></i> Oldingi
                </button>
                <span class="text-xs text-slate-400" x-text="studentsPage + ' / ' + Math.max(1, Math.ceil(filteredStudents.length / 15))"></span>
                <button @click="studentsPage < Math.ceil(filteredStudents.length / 15) && studentsPage++" :disabled="studentsPage >= Math.ceil(filteredStudents.length / 15)" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs disabled:opacity-40 transition">
                    Keyingi <i class="fas fa-chevron-right ml-1"></i>
                </button>
            </div>
        </div>
    </div>
</div>
