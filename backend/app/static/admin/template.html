<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDUGATE — Hokimlik & MMTV Yagona Boshqaruv Markazi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- EDUGATE Custom CSS -->

        <!-- include: components/sidebar.html -->

            <!-- include: components/topbar.html -->

            <main class="flex-1 overflow-y-auto p-6 space-y-6">

                <!-- include: views/students.html -->

                <!-- include: views/devices.html -->
                <!-- include: views/parents.html -->
                <!-- include: views/reports.html -->
                <!-- include: views/settings.html -->
            </main>
        </div>
    </div>

    <!-- include: components/modals.html -->

    <!-- include: components/toasts.html -->

    <!-- JAVASCRIPT MODULES -->
    <script src="./js/api.js"></script>
    <script src="./js/charts.js"></script>
    <script src="./js/app.js"></script>

</html>
