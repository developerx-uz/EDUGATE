    <!-- Early theme initializer to prevent flash of wrong theme -->
    <script>
    (function() {
        try {
            var saved = localStorage.getItem('edugate_admin_theme');
            var theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
            if (theme === 'light') {
                document.documentElement.classList.add('light');
                document.documentElement.classList.remove('dark');
            } else {
                document.documentElement.classList.add('dark');
                document.documentElement.classList.remove('light');
            }
        } catch(e) {}
    })();
    </script>

    <!-- Register Service Worker for Native Chrome PWA install (no UI button) -->
    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            const isEdugate = window.location.pathname.includes('/edugate');
            const swUrl = isEdugate ? '/edugate/sw.js' : '/sw.js';
            const scopeUrl = isEdugate ? '/edugate/' : '/';
            navigator.serviceWorker.register(swUrl, { scope: scopeUrl })
                .then(reg => console.log('EDUGATE PWA service worker registered', reg.scope))
                .catch(err => console.warn('EDUGATE SW registration failed:', err));
        });
    }
    </script>
