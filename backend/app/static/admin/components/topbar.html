<!-- TOPBAR COMPONENT (Permanent Full-Width Header) -->
<header class="sticky top-0 z-20 bg-black border-b border-neutral-800/80 px-4 h-[54px] flex items-center justify-between flex-shrink-0 select-none">
    <!-- Left: Brand Logo & Title + Current Section Title -->
    <div class="flex items-center gap-3 min-w-0">
        <!-- Mobile Toggle Button -->
        <button @click="toggleSidebar()" 
                class="md:hidden flex items-center justify-center w-7 h-7 rounded-lg text-neutral-400 hover:text-white hover:bg-neutral-900 border border-neutral-800/80 hover:border-neutral-700 transition cursor-pointer flex-shrink-0 select-none"
                title="Menyu">
            <svg class="w-3.5 h-3.5 text-neutral-300 transition-transform duration-300 ease-in-out"
                 :style="sidebarOpenMobile ? 'transform: rotateY(180deg);' : 'transform: rotateY(0deg);'"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="4" />
                <line x1="8.5" y1="3" x2="8.5" y2="21" stroke-dasharray="2 1.5" />
            </svg>
        </button>

        <!-- Brand Logo Badge -->
        <div class="flex-shrink-0 w-8 h-8 rounded-xl bg-gradient-to-tr from-emerald-500/20 to-teal-500/20 border border-emerald-500/30 text-emerald-400 flex items-center justify-center font-extrabold text-sm shadow-sm shadow-emerald-500/10">
            <span>E</span>
        </div>

        <!-- Brand Title & Subtitle -->
        <div class="flex items-baseline gap-2 min-w-0">
            <span class="text-white font-extrabold text-xs sm:text-sm tracking-wider leading-none truncate max-w-[160px] sm:max-w-xs" x-text="portalTitle">EDUGATE</span>
            <span class="hidden sm:inline-block px-1.5 py-0.5 rounded bg-neutral-900 border border-neutral-800 text-[10px] text-emerald-400 font-mono font-medium leading-none" x-text="portalSubtitle">Boshqaruv Markazi</span>
        </div>

        <div class="hidden lg:block h-4 w-px bg-neutral-800 mx-1"></div>

        <!-- Current View Title -->
        <h1 class="hidden lg:block text-xs font-semibold text-neutral-400 truncate"
            x-text="({
                dashboard: 'Asosiy Boshqaruv Markazi',
                stats: 'Tizim Statistikasi & Tahlillar',
                attendance: 'Jonli Davomat Monitoringi',
                schools: isSchoolAdmin ? 'Sinflar & O\'quvchilar' : 'Maktablar Boshqaruvi',
                students: 'O\'quvchilar Kontingenti',
                teachers: 'O\'qituvchilar Tarkibi',
                parents: 'Ota-onalar & Telegram Bot',
                devices: 'Kameralar & Turniketlar',
                reports: 'Tahliliy Hisobotlar',
                notifications: 'Bildirishnomalar & Arizalar',
                settings: 'Tizim Sozlamalari & Audit',
                profile: 'Profil & Xavfsizlik Sozlamalari'
            })[activeTab] || 'EDUGATE'"></h1>
    </div>

    <!-- Right: Search, Live Status, Notifications, Refresh & User -->
    <div class="flex items-center gap-2">
        <!-- Quick Global Search (Ctrl+K) -->
        <button @click="openGlobalSearch()"
                class="hidden sm:flex items-center gap-2 h-8 px-2.5 rounded-full bg-neutral-900/90 hover:bg-neutral-800 text-neutral-400 hover:text-white border border-neutral-800 hover:border-neutral-700 transition cursor-pointer text-[11px]"
                title="Tezkor qidiruv (Ctrl+K)">
            <i class="fas fa-magnifying-glass text-[10px]"></i>
            <span class="hidden md:inline">Qidiruv</span>
            <kbd class="hidden md:inline px-1.5 py-0.5 rounded bg-neutral-800 text-[9px] font-mono text-neutral-400">Ctrl+K</kbd>
        </button>

        <!-- Live Telemetry Status Pill -->
        <div class="hidden md:flex items-center gap-1.5 h-8 px-2.5 rounded-full bg-neutral-900/90 border border-neutral-800 text-[10px] font-mono"
             :title="lastSyncTime ? 'Oxirgi sinxronizatsiya: ' + lastSyncTime : 'Real-vaqt ulanish'">
            <span class="w-1.5 h-1.5 rounded-full"
                  :class="realtimeStatus === 'offline' ? 'bg-rose-500' : (realtimeStatus === 'syncing' ? 'bg-amber-400' : 'bg-emerald-400 animate-pulse')"></span>
            <span :class="realtimeStatus === 'offline' ? 'text-rose-400' : 'text-neutral-300'"
                  x-text="realtimeStatus === 'offline' ? 'OFFLINE' : (liveTime || 'LIVE')">LIVE</span>
        </div>

        <!-- Notifications Bell -->
        <div class="relative">
            <button @click="showNotifPanel = !showNotifPanel"
                    class="relative w-8 h-8 flex items-center justify-center text-neutral-400 hover:text-white hover:bg-neutral-900 border border-neutral-800 hover:border-neutral-700 rounded-full transition cursor-pointer"
                    title="Bildirishnomalar">
                <i class="fas fa-bell text-xs"></i>
                <span x-show="unreadNotificationsCount > 0" class="absolute top-1.5 right-1.5 w-2 h-2 bg-indigo-500 rounded-full ring-2 ring-black"></span>
            </button>

            <!-- Notifications Dropdown Panel (fixed right-0 alignment so it never overflows right edge) -->
            <div x-show="showNotifPanel" @click.outside="showNotifPanel = false" x-cloak
                 class="absolute right-0 mt-2 w-80 max-w-[calc(100vw-2rem)] glass-card rounded-2xl p-4 shadow-2xl z-50 border border-neutral-800 space-y-3">
                <div class="flex items-center justify-between pb-2 border-b border-neutral-800">
                    <span class="text-xs font-bold text-white uppercase tracking-wider">Bildirishnomalar</span>
                    <div class="flex items-center gap-2">
                        <button @click="activeTab = 'notifications'; showNotifPanel = false; fetchNotifications()" class="text-[10px] text-indigo-400 hover:text-indigo-300 font-semibold cursor-pointer">Barchasi</button>
                        <span class="text-[10px] text-neutral-500 cursor-pointer hover:text-white" @click="showNotifPanel = false">Yopish</span>
                    </div>
                </div>
                <div class="space-y-2 text-xs max-h-72 overflow-y-auto">
                    <template x-for="item in notifications.slice(0, 6)" :key="item.id">
                        <div class="flex items-start gap-2.5 p-2 rounded-xl hover:bg-neutral-900 transition">
                            <i :class="['fas', item.icon || 'fa-circle-info', item.color || 'text-indigo-400', 'mt-0.5']"></i>
                            <div class="flex-1 min-w-0">
                                <p class="text-white text-xs font-medium leading-snug" x-text="item.text"></p>
                                <span class="text-[10px] text-neutral-500 font-mono" x-text="item.time"></span>
                            </div>
                        </div>
                    </template>
                    <div x-show="!notifications || notifications.length === 0" class="py-4 text-center text-neutral-500 text-xs">
                        Yangi bildirishnomalar yo'q
                    </div>
                </div>
            </div>
        </div>

        <!-- Refresh Button -->
        <button @click="triggerManualRefresh()" 
                :disabled="isRefreshing"
                class="btn-refresh-fixed flex items-center justify-center gap-1.5 rounded-full bg-neutral-900/90 hover:bg-neutral-800 text-neutral-300 hover:text-white border border-neutral-800 hover:border-neutral-700 transition-colors cursor-pointer text-xs font-semibold shadow-sm disabled:opacity-60 flex-shrink-0 select-none overflow-hidden px-3 py-1.5"
                title="Ma'lumotlarni yangilash">
            <i class="fas fa-arrows-rotate text-xs text-indigo-400 flex-shrink-0"
               :class="isRefreshing ? 'fa-spin' : ''"></i>
            <span class="hidden sm:inline text-center">Yangilash</span>
        </button>

        <!-- User Pill Menu -->
        <div class="relative">
            <button @click="showUserMenu = !showUserMenu" 
                    class="flex items-center gap-2 pl-1.5 pr-2.5 py-1 rounded-full bg-neutral-900/90 hover:bg-neutral-800 border border-neutral-800 hover:border-neutral-700 transition cursor-pointer group shadow-sm">
                <div class="relative">
                    <div class="w-7 h-7 rounded-full bg-gradient-to-tr from-indigo-600 to-violet-500 text-white flex items-center justify-center text-[11px] font-bold shadow-md shadow-indigo-600/20">
                        <i class="fas fa-user-shield text-[11px]"></i>
                    </div>
                    <span class="absolute -bottom-0.5 -right-0.5 w-2 h-2 rounded-full bg-emerald-400 ring-2 ring-black"></span>
                </div>

                <div class="text-left hidden sm:block">
                    <p class="text-xs font-bold text-white group-hover:text-indigo-300 transition leading-tight" x-text="currentUser?.full_name || 'Superadmin'">Superadmin</p>
                    <p class="text-[9px] text-neutral-400 font-medium leading-tight" x-text="portalSubtitle">Hokimlik Markazi</p>
                </div>

                <i class="fas fa-chevron-down text-[9px] text-neutral-400 group-hover:text-white transition ml-0.5"
                   :class="showUserMenu ? 'rotate-180' : ''"></i>
            </button>

            <div x-show="showUserMenu" @click.outside="showUserMenu = false" x-cloak
                 class="absolute right-0 mt-2 w-60 glass-card rounded-2xl p-2 shadow-2xl z-50 border border-neutral-800 space-y-1">
                <div class="px-3 py-2 border-b border-neutral-800 mb-1">
                    <p class="text-xs font-bold text-white truncate" x-text="currentUser?.full_name || 'Superadmin'">Superadmin</p>
                    <p class="text-[10px] text-neutral-400 font-mono truncate" x-text="currentUser?.email || (currentUser?.username ? '@' + currentUser.username : 'admin@edugate.uz')">admin@edugate.uz</p>
                </div>
                <button @click="showUserMenu = false; activeTab = 'profile'" 
                        class="w-full flex items-center gap-2.5 px-3 py-2 text-xs text-neutral-300 hover:text-white hover:bg-neutral-800 rounded-xl transition text-left cursor-pointer">
                    <i class="fas fa-id-card text-neutral-400 w-4"></i>
                    <span>Profil & Xavfsizlik</span>
                </button>
                <div class="border-t border-neutral-800 my-1"></div>
                <button @click="showUserMenu = false; logout()" 
                        class="w-full flex items-center gap-2.5 px-3 py-2 text-xs text-rose-400 hover:text-rose-300 hover:bg-rose-950/30 rounded-xl transition text-left cursor-pointer">
                    <i class="fas fa-right-from-bracket w-4"></i>
                    <span>Tizimdan chiqish</span>
                </button>
            </div>
        </div>
    </div>
</header>
