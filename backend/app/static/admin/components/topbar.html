<!-- TOPBAR COMPONENT -->
<header class="sticky top-0 z-10 bg-slate-900/95 backdrop-blur border-b border-slate-800 px-6 py-3">
    <div class="flex items-center justify-between gap-4">
        <!-- Left: Universal Sidebar Toggle + Page title -->
        <div class="flex items-center gap-3">
            <button @click="toggleSidebar()" 
                    class="p-2 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800/80 border border-slate-700/60 transition cursor-pointer flex items-center justify-center shadow-sm"
                    :title="sidebarCollapsed ? 'Yon panelni kengaytirish' : 'Yon panelni yopish'">
                <i :class="sidebarCollapsed ? 'fas fa-bars-staggered text-sm text-indigo-400' : 'fas fa-bars text-sm'"></i>
            </button>
            <h1 class="text-lg font-bold text-white hidden sm:block"
                x-text="({
                    dashboard: 'Asosiy Boshqaruv Markazi',
                    schools: 'Maktablar Boshqaruvi',
                    students: 'O\'quvchilar Kontingenti',
                    teachers: 'O\'qituvchilar Tarkibi',
                    attendance: 'Jonli Davomat Monitoringi',
                    devices: 'Kameralar & Turniketlar',
                    parents: 'Ota-onalar Ro\'yxati',
                    reports: 'Tahliliy Hisobotlar',
                    settings: 'Tizim Sozlamalari'
                })[activeTab] || 'EDUGATE'"></h1>
        </div>

        <!-- Right: Actions & Notifications -->
        <div class="flex items-center gap-3">
            <!-- Notifications Bell -->
            <div class="relative">
                <button @click="showNotifPanel = !showNotifPanel"
                        class="relative p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl transition">
                    <i class="fas fa-bell text-sm"></i>
                    <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-indigo-500 rounded-full ring-2 ring-slate-900"></span>
                </button>

                <!-- Notifications Dropdown Panel -->
                <div x-show="showNotifPanel" @click.outside="showNotifPanel = false" x-cloak
                     class="absolute right-0 mt-2 w-80 glass-card rounded-2xl p-4 shadow-2xl z-50 border border-slate-800 space-y-3">
                    <div class="flex items-center justify-between pb-2 border-b border-slate-800">
                        <span class="text-xs font-bold text-white uppercase tracking-wider">Bildirishnomalar</span>
                        <span class="text-[10px] text-indigo-400 font-semibold cursor-pointer" @click="showNotifPanel = false">Yopish</span>
                    </div>
                    <div class="space-y-2 text-xs">
                        <template x-for="item in notifications" :key="item.id">
                            <div class="flex items-start gap-2.5 p-2 rounded-xl hover:bg-slate-800/60 transition">
                                <i :class="['fas', item.icon, item.color, 'mt-0.5']"></i>
                                <div class="flex-1 min-w-0">
                                    <p class="text-white text-xs font-medium" x-text="item.text"></p>
                                    <span class="text-[10px] text-slate-500" x-text="item.time"></span>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>



            <!-- Foydalanuvchi Ramkasi (User Profile Box) -->
            <div class="relative">
                <button @click="showUserMenu = !showUserMenu" 
                        class="flex items-center gap-2.5 px-3 py-1.5 rounded-xl bg-slate-800/80 hover:bg-slate-800 border border-slate-700/60 hover:border-slate-600 transition cursor-pointer group shadow-sm">
                    <!-- User Avatar with Online Dot -->
                    <div class="relative">
                        <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-600 to-violet-500 text-white flex items-center justify-center text-xs font-bold shadow-md shadow-indigo-600/20">
                            <i class="fas fa-user-shield text-xs"></i>
                        </div>
                        <span class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-emerald-400 ring-2 ring-slate-900"></span>
                    </div>

                    <!-- User Name & Role -->
                    <div class="text-left hidden sm:block">
                        <p class="text-xs font-bold text-white group-hover:text-indigo-300 transition leading-tight">Superadmin</p>
                        <p class="text-[10px] text-slate-400 font-medium leading-tight">Hokimlik Markazi</p>
                    </div>

                    <i class="fas fa-chevron-down text-[10px] text-slate-400 group-hover:text-white transition ml-0.5"></i>
                </button>

                <!-- User Dropdown Menu -->
                <div x-show="showUserMenu" @click.outside="showUserMenu = false" x-cloak
                     class="absolute right-0 mt-2 w-56 glass-card rounded-2xl p-2 shadow-2xl z-50 border border-slate-700/80 space-y-1">
                    <div class="px-3 py-2 border-b border-slate-800 mb-1">
                        <p class="text-xs font-bold text-white">Superadmin</p>
                        <p class="text-[10px] text-slate-400">admin@edugate.uz</p>
                        <span class="inline-block mt-1.5 px-2 py-0.5 rounded-md bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 text-[9px] font-bold uppercase tracking-wider">Hokimiyat Portali</span>
                    </div>

                    <div @click="activeTab = 'settings'; showUserMenu = false"
                         class="flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs text-slate-300 hover:text-white hover:bg-slate-800 cursor-pointer transition">
                        <i class="fas fa-gear text-slate-400 text-xs w-4 text-center"></i>
                        <span>Tizim Sozlamalari</span>
                    </div>

                    <div @click="openSchoolModal(); showUserMenu = false"
                         class="flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs text-slate-300 hover:text-white hover:bg-slate-800 cursor-pointer transition">
                        <i class="fas fa-plus text-indigo-400 text-xs w-4 text-center"></i>
                        <span>Yangi Maktab Qo'shish</span>
                    </div>

                    <div class="border-t border-slate-800 my-1"></div>

                    <div @click="logout(); showUserMenu = false"
                         class="flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs text-rose-400 hover:bg-rose-500/10 cursor-pointer transition font-semibold">
                        <i class="fas fa-right-from-bracket text-xs w-4 text-center"></i>
                        <span>Tizimdan Chiqish</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
