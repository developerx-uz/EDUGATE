<!-- TOPBAR COMPONENT -->
<header class="sticky top-0 z-10 bg-black border-b border-neutral-800 px-5 h-[52px] flex items-center justify-between flex-shrink-0">
    <div class="flex items-center justify-between gap-3 w-full">
        <!-- Left: Page Title (and mobile menu toggle) -->
        <div class="flex items-center gap-3 min-w-0">
            <!-- Mobile Toggle Button (only on small screens < 768px) -->
            <button @click="toggleSidebar()" 
                    class="md:hidden flex items-center justify-center w-7 h-7 rounded-lg text-neutral-400 hover:text-white hover:bg-neutral-900 border border-neutral-800/80 hover:border-neutral-700 transition cursor-pointer flex-shrink-0 select-none"
                    title="Menyu">
                <svg class="w-4 h-4 text-neutral-300 transition-transform duration-300 ease-in-out"
                     :class="sidebarOpenMobile ? 'rotate-180' : 'rotate-0'"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="5" />
                    <line x1="8.5" y1="7.5" x2="8.5" y2="16.5" stroke-width="2.5" stroke-linecap="round" />
                </svg>
            </button>

            <h1 class="text-sm sm:text-base font-bold text-white truncate"
                x-text="({
                    dashboard: 'Asosiy Boshqaruv Markazi',
                    schools: 'Maktablar Boshqaruvi',
                    students: 'O\'quvchilar Kontingenti',
                    teachers: 'O\'qituvchilar Tarkibi',
                    attendance: 'Jonli Davomat Monitoringi',
                    devices: 'Kameralar & Turniketlar',
                    parents: 'Ota-onalar Ro\'yxati',
                    reports: 'Tahliliy Hisobotlar',
                    settings: 'Tizim Sozlamalari',
                    profile: 'Profil & Xavfsizlik Sozlamalari'
                })[activeTab] || 'EDUGATE'"></h1>
        </div>

        <!-- Right: Actions & Notifications -->
        <div class="flex items-center gap-2">
            <!-- Yangilash Tugmasi (Aylana / Pill Ramka - Faqat Iconka Aylanadi) -->
            <button @click="triggerManualRefresh()" 
                    :disabled="isRefreshing"
                    class="btn-refresh-fixed flex items-center justify-center gap-1.5 rounded-full bg-neutral-900/90 hover:bg-neutral-800 text-neutral-300 hover:text-white border border-neutral-800 hover:border-neutral-700 transition-colors cursor-pointer text-xs font-semibold shadow-sm disabled:opacity-60 flex-shrink-0 select-none overflow-hidden"
                    title="Ma'lumotlarni yangilash">
                <i class="fas fa-arrows-rotate text-xs text-indigo-400 flex-shrink-0"
                   :class="isRefreshing ? 'fa-spin' : ''"></i>
                <span class="hidden sm:inline text-center">Yangilash</span>
            </button>

            <!-- Notifications Bell -->
            <div class="relative">
                <button @click="showNotifPanel = !showNotifPanel"
                        class="relative w-7 h-7 flex items-center justify-center text-neutral-400 hover:text-white hover:bg-neutral-900 rounded-lg transition cursor-pointer">
                    <i class="fas fa-bell text-xs"></i>
                    <span class="absolute top-1 right-1 w-2 h-2 bg-indigo-500 rounded-full ring-2 ring-black"></span>
                </button>

                <!-- Notifications Dropdown Panel -->
                <div x-show="showNotifPanel" @click.outside="showNotifPanel = false" x-cloak
                     class="absolute right-0 mt-2 w-80 glass-card rounded-2xl p-4 shadow-2xl z-50 border border-neutral-800 space-y-3">
                    <div class="flex items-center justify-between pb-2 border-b border-neutral-800">
                        <span class="text-xs font-bold text-white uppercase tracking-wider">Bildirishnomalar</span>
                        <span class="text-[10px] text-indigo-400 font-semibold cursor-pointer" @click="showNotifPanel = false">Yopish</span>
                    </div>
                    <div class="space-y-2 text-xs">
                        <template x-for="item in notifications" :key="item.id">
                            <div class="flex items-start gap-2.5 p-2 rounded-xl hover:bg-neutral-900 transition">
                                <i :class="['fas', item.icon, item.color, 'mt-0.5']"></i>
                                <div class="flex-1 min-w-0">
                                    <p class="text-white text-xs font-medium" x-text="item.text"></p>
                                    <span class="text-[10px] text-neutral-500" x-text="item.time"></span>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <!-- Dual Theme Switcher (Oq Mavzu ☀️ / Qora Mavzu 🌙 Ramkalari) -->
            <div class="theme-switch-pill inline-flex items-center p-0.5 rounded-lg border transition-all duration-200"
                 :class="theme === 'light' ? 'bg-neutral-100 border-neutral-300' : 'bg-neutral-900 border-neutral-800'">
                <!-- Oq Mavzu Ramkasi (Sun Icon ☀️) -->
                <button type="button" 
                        @click="applyTheme('light')" 
                        class="theme-btn-light flex items-center justify-center w-6 h-6 rounded-md transition-all duration-200 cursor-pointer"
                        :class="theme === 'light' 
                            ? 'bg-white text-amber-500 shadow-sm border border-neutral-300 font-bold scale-105' 
                            : 'text-neutral-500 hover:text-neutral-300 hover:bg-neutral-800/60'"
                        title="Oq mavzu (Yorug')">
                    <i class="fas fa-sun text-[11px]"></i>
                </button>
                
                <!-- Qora Mavzu Ramkasi (Moon Icon 🌙) -->
                <button type="button" 
                        @click="applyTheme('dark')" 
                        class="theme-btn-dark flex items-center justify-center w-6 h-6 rounded-md transition-all duration-200 cursor-pointer"
                        :class="theme === 'dark' 
                            ? 'bg-neutral-800 text-white shadow-sm border border-neutral-700 font-bold scale-105' 
                            : 'text-neutral-400 hover:text-neutral-800 hover:bg-neutral-200'"
                        title="Qora mavzu (OLED Qorong'u)">
                    <i class="fas fa-moon text-[11px]"></i>
                </button>
            </div>

            <!-- Foydalanuvchi Ramkasi (Aylana / Pill Ramka) -->
            <div class="relative">
                <button @click="showUserMenu = !showUserMenu" 
                        class="flex items-center gap-2 pl-1.5 pr-2.5 py-1 rounded-full bg-neutral-900/90 hover:bg-neutral-800 border border-neutral-800 hover:border-neutral-700 transition cursor-pointer group shadow-sm">
                    <!-- User Avatar with Online Dot -->
                    <div class="relative">
                        <div class="w-7 h-7 rounded-full bg-gradient-to-tr from-indigo-600 to-violet-500 text-white flex items-center justify-center text-[11px] font-bold shadow-md shadow-indigo-600/20">
                            <i class="fas fa-user-shield text-[11px]"></i>
                        </div>
                        <span class="absolute -bottom-0.5 -right-0.5 w-2 h-2 rounded-full bg-emerald-400 ring-2 ring-black"></span>
                    </div>

                    <!-- User Name & Role -->
                    <div class="text-left hidden sm:block">
                        <p class="text-xs font-bold text-white group-hover:text-indigo-300 transition leading-tight" x-text="currentUser?.full_name || 'Superadmin'">Superadmin</p>
                        <p class="text-[9px] text-neutral-400 font-medium leading-tight" x-text="portalSubtitle">Hokimlik Markazi</p>
                    </div>

                    <i class="fas fa-chevron-down text-[9px] text-neutral-400 group-hover:text-white transition ml-0.5"
                       :class="showUserMenu ? 'rotate-180' : ''"></i>
                </button>

                <!-- User Dropdown Menu -->
                <div x-show="showUserMenu" @click.outside="showUserMenu = false" x-cloak
                     class="absolute right-0 mt-2 w-60 glass-card rounded-2xl p-2 shadow-2xl z-50 border border-neutral-800 space-y-1">
                    <div class="px-3 py-2 border-b border-neutral-800 mb-1">
                        <p class="text-xs font-bold text-white truncate" x-text="currentUser?.full_name || 'Superadmin'">Superadmin</p>
                        <p class="text-[10px] text-neutral-400 font-mono truncate" x-text="currentUser?.email || (currentUser?.username ? '@' + currentUser.username : 'admin@edugate.uz')">admin@edugate.uz</p>
                        <span class="inline-block mt-1.5 px-2 py-0.5 rounded-md text-[9px] font-bold uppercase tracking-wider font-mono border"
                              :class="isSchoolAdmin ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : (isMinistryViewer ? 'bg-amber-500/10 text-amber-400 border-amber-500/20' : 'bg-indigo-500/10 text-indigo-400 border-indigo-500/20')"
                              x-text="isSchoolAdmin ? 'Maktab Portali (1 Login)' : (isMinistryViewer ? 'Xalq Ta\'limi (Read-Only)' : 'Superadmin Portali')"></span>
                    </div>

                    <!-- Profil Sozlamalari Tugmasi -->
                    <div @click="openProfileSettings(); showUserMenu = false"
                         class="flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs text-neutral-300 hover:text-white hover:bg-neutral-900 cursor-pointer transition group">
                        <i class="fas fa-user-gear text-indigo-400 text-xs w-4 text-center group-hover:scale-110 transition-transform"></i>
                        <span class="font-medium">Profil Sozlamalari</span>
                    </div>

                    <!-- Theme Toggle in Dropdown -->
                    <div @click="toggleTheme(); showUserMenu = false"
                         class="flex items-center justify-between px-3 py-2 rounded-xl text-xs text-neutral-300 hover:text-white hover:bg-neutral-900 cursor-pointer transition">
                        <div class="flex items-center gap-2.5">
                            <i :class="theme === 'light' ? 'fas fa-moon text-amber-500' : 'fas fa-sun text-amber-400'" class="text-xs w-4 text-center"></i>
                            <span x-text="theme === 'light' ? 'To\'liq Qora rejim' : 'To\'liq Oq rejim'"></span>
                        </div>
                        <span class="text-[10px] px-1.5 py-0.5 rounded font-mono font-bold"
                              :class="theme === 'light' ? 'bg-amber-500/10 text-amber-600 border border-amber-500/20' : 'bg-neutral-800 text-neutral-300 border border-neutral-700'"
                              x-text="theme === 'light' ? 'OQ' : 'QORA'"></span>
                    </div>

                    <div class="border-t border-neutral-800 my-1"></div>

                    <div @click="logout(); showUserMenu = false"
                         class="flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs text-rose-400 hover:bg-rose-500/10 cursor-pointer transition font-semibold">
                        <i class="fas fa-right-from-bracket text-xs w-4 text-center"></i>
                        <span>Tizimdan Chiqish</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
