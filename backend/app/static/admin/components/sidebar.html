<!-- SIDEBAR COMPONENT -->
<aside :class="[sidebarCollapsed ? 'w-20' : 'w-[260px]', sidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0']"
       class="fixed left-0 top-0 h-screen bg-slate-950 border-r border-slate-800 z-30 flex flex-col transition-all duration-300">

    <!-- Logo Area -->
    <div class="flex items-center gap-3 px-4 py-5 border-b border-slate-800/60">
        <div class="flex-shrink-0 w-10 h-10 bg-indigo-600/20 rounded-xl flex items-center justify-center border border-indigo-500/30">
            <span class="text-indigo-400 font-extrabold text-lg">E</span>
        </div>
        <div x-show="!sidebarCollapsed" x-transition class="min-w-0">
            <h2 class="text-white font-extrabold text-base leading-tight truncate">EDUGATE</h2>
            <p class="text-slate-500 text-[10px] leading-tight truncate">Hokimlik & MMTV Yagona Markazi</p>
        </div>
    </div>

    <!-- Navigation Menu -->
    <nav class="flex-1 overflow-y-auto px-3 py-4 space-y-1">
        <!-- Main Group -->
        <div @click="activeTab = 'dashboard'; sidebarOpen = false"
             class="sidebar-item" :class="{'active': activeTab === 'dashboard'}">
            <i class="fas fa-chart-pie w-5 text-center"></i>
            <span x-show="!sidebarCollapsed">Dashboard</span>
        </div>
        <div @click="activeTab = 'schools'; schoolsView = 'schools_list'; sidebarOpen = false"
             class="sidebar-item" :class="{'active': activeTab === 'schools'}">
            <i class="fas fa-school w-5 text-center"></i>
            <span x-show="!sidebarCollapsed">Maktablar</span>
        </div>
        <div @click="activeTab = 'students'; sidebarOpen = false"
             class="sidebar-item" :class="{'active': activeTab === 'students'}">
            <i class="fas fa-user-graduate w-5 text-center"></i>
            <span x-show="!sidebarCollapsed">O'quvchilar</span>
        </div>
        <div @click="activeTab = 'teachers'; sidebarOpen = false"
             class="sidebar-item" :class="{'active': activeTab === 'teachers'}">
            <i class="fas fa-chalkboard-user w-5 text-center"></i>
            <span x-show="!sidebarCollapsed">O'qituvchilar</span>
        </div>

        <div class="border-t border-slate-800/60 my-3"></div>

        <!-- Monitoring Group -->
        <div @click="activeTab = 'attendance'; sidebarOpen = false"
             class="sidebar-item" :class="{'active': activeTab === 'attendance'}">
            <i class="fas fa-clipboard-check w-5 text-center"></i>
            <span x-show="!sidebarCollapsed">Davomat</span>
        </div>
        <div @click="activeTab = 'devices'; sidebarOpen = false"
             class="sidebar-item" :class="{'active': activeTab === 'devices'}">
            <i class="fas fa-video w-5 text-center"></i>
            <span x-show="!sidebarCollapsed">Kameralar</span>
        </div>
        <div @click="activeTab = 'parents'; sidebarOpen = false"
             class="sidebar-item" :class="{'active': activeTab === 'parents'}">
            <i class="fas fa-users w-5 text-center"></i>
            <span x-show="!sidebarCollapsed">Ota-onalar</span>
        </div>

        <div class="border-t border-slate-800/60 my-3"></div>

        <!-- Reports & Settings Group -->
        <div @click="activeTab = 'reports'; sidebarOpen = false"
             class="sidebar-item" :class="{'active': activeTab === 'reports'}">
            <i class="fas fa-chart-bar w-5 text-center"></i>
            <span x-show="!sidebarCollapsed">Hisobotlar</span>
        </div>
        <div @click="activeTab = 'settings'; sidebarOpen = false"
             class="sidebar-item" :class="{'active': activeTab === 'settings'}">
            <i class="fas fa-gear w-5 text-center"></i>
            <span x-show="!sidebarCollapsed">Sozlamalar</span>
        </div>
    </nav>

    <!-- Bottom Actions -->
    <div class="px-3 pb-4 space-y-2 border-t border-slate-800/60 pt-3">
        <button @click="openSchoolModal()"
                class="w-full flex items-center justify-center gap-2 px-4 py-2.5 bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-400 rounded-xl text-sm font-semibold border border-indigo-500/20 hover:border-indigo-500/40 transition-all">
            <i class="fas fa-plus"></i>
            <span x-show="!sidebarCollapsed">Yangi Maktab</span>
        </button>

        <!-- Admin Profile Info -->
        <div class="flex items-center gap-3 px-3 py-2">
            <div class="w-9 h-9 bg-slate-800 rounded-xl flex items-center justify-center flex-shrink-0 text-slate-300">
                <i class="fas fa-user-shield text-sm"></i>
            </div>
            <div x-show="!sidebarCollapsed" class="min-w-0">
                <p class="text-sm font-semibold text-white truncate">Superadmin</p>
                <p class="text-xs text-slate-500 truncate">Hokimlik Markazi</p>
            </div>
        </div>

        <!-- Logout -->
        <button @click="logout()"
                class="w-full flex items-center justify-center gap-2 px-4 py-2 text-rose-400 hover:bg-rose-500/10 rounded-xl text-xs font-semibold transition-all">
            <i class="fas fa-right-from-bracket"></i>
            <span x-show="!sidebarCollapsed">Chiqish</span>
        </button>
    </div>
</aside>
