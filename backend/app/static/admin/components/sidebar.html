<!-- SIDEBAR COMPONENT (Supabase Style Slim & Elegant) -->
<aside :class="[sidebarCollapsed ? 'collapsed w-[60px]' : 'w-[230px]', sidebarOpenMobile ? 'translate-x-0' : '-translate-x-full md:translate-x-0']"
       class="sidebar-container fixed md:relative left-0 top-0 h-screen bg-black border-r border-neutral-800/80 z-30 flex flex-col select-none overflow-hidden no-scrollbar flex-shrink-0 transition-all duration-300">

    <!-- Top Brand Logo -->
    <div class="flex items-center h-[54px] border-b border-neutral-800/80 flex-shrink-0 px-3 overflow-hidden"
         :class="sidebarCollapsed ? 'justify-center' : 'justify-start gap-3'">
        <!-- Logo Icon (Supabase Emerald / Gradient style) -->
        <div class="flex-shrink-0 w-8 h-8 rounded-xl bg-gradient-to-tr from-emerald-500/20 to-teal-500/20 border border-emerald-500/30 text-emerald-400 flex items-center justify-center font-extrabold text-sm shadow-sm shadow-emerald-500/10">
            <span>E</span>
        </div>
        <!-- Brand Title (when expanded) -->
        <div x-show="!sidebarCollapsed"
             x-transition:enter="transition ease-out duration-200"
             x-transition:enter-start="opacity-0 -translate-x-2"
             x-transition:enter-end="opacity-100 translate-x-0"
             class="min-w-0 whitespace-nowrap overflow-hidden">
            <h2 class="text-white font-extrabold text-xs tracking-wider leading-tight truncate">EDUGATE</h2>
            <p class="text-neutral-500 text-[9px] leading-tight truncate font-mono">Boshqaruv Markazi</p>
        </div>
    </div>

    <!-- Navigation Menu (Centered Icons like Supabase) -->
    <nav class="flex-1 overflow-y-auto overflow-x-hidden p-2 space-y-1.5 no-scrollbar">
        <!-- Dashboard -->
        <div @click="activeTab = 'dashboard'; if (window.innerWidth < 768) sidebarOpenMobile = false"
             class="sidebar-item flex items-center h-9 rounded-xl cursor-pointer transition-all duration-150 overflow-hidden"
             :class="activeTab === 'dashboard' ? 'bg-neutral-900 text-white border border-neutral-800 font-semibold' : 'text-neutral-400 hover:text-white hover:bg-neutral-900/60 border border-transparent'"
             :title="sidebarCollapsed ? 'Dashboard' : ''">
            <div class="w-9 h-9 flex items-center justify-center flex-shrink-0">
                <i class="fas fa-house text-sm"></i>
            </div>
            <span x-show="!sidebarCollapsed" class="ml-2 text-xs whitespace-nowrap overflow-hidden">Dashboard</span>
        </div>

        <!-- Statistika -->
        <div @click="activeTab = 'stats'; if (window.innerWidth < 768) sidebarOpenMobile = false"
             class="sidebar-item flex items-center h-9 rounded-xl cursor-pointer transition-all duration-150 overflow-hidden"
             :class="activeTab === 'stats' ? 'bg-neutral-900 text-white border border-neutral-800 font-semibold' : 'text-neutral-400 hover:text-white hover:bg-neutral-900/60 border border-transparent'"
             :title="sidebarCollapsed ? 'Statistika' : ''">
            <div class="w-9 h-9 flex items-center justify-center flex-shrink-0">
                <i class="fas fa-chart-line text-sm"></i>
            </div>
            <span x-show="!sidebarCollapsed" class="ml-2 text-xs whitespace-nowrap overflow-hidden">Statistika</span>
        </div>

        <!-- Maktablar -->
        <div x-show="!isSchoolAdmin" @click="activeTab = 'schools'; schoolsView = 'schools_list'; if (window.innerWidth < 768) sidebarOpenMobile = false"
             class="sidebar-item flex items-center h-9 rounded-xl cursor-pointer transition-all duration-150 overflow-hidden"
             :class="activeTab === 'schools' ? 'bg-neutral-900 text-white border border-neutral-800 font-semibold' : 'text-neutral-400 hover:text-white hover:bg-neutral-900/60 border border-transparent'"
             :title="sidebarCollapsed ? 'Maktablar' : ''">
            <div class="w-9 h-9 flex items-center justify-center flex-shrink-0">
                <i class="fas fa-school text-sm"></i>
            </div>
            <span x-show="!sidebarCollapsed" class="ml-2 text-xs whitespace-nowrap overflow-hidden">Maktablar</span>
        </div>

        <div class="border-t border-neutral-800/80 my-2 mx-1"></div>

        <!-- Kameralar -->
        <div @click="activeTab = 'devices'; if (window.innerWidth < 768) sidebarOpenMobile = false"
             class="sidebar-item flex items-center h-9 rounded-xl cursor-pointer transition-all duration-150 overflow-hidden"
             :class="activeTab === 'devices' ? 'bg-neutral-900 text-white border border-neutral-800 font-semibold' : 'text-neutral-400 hover:text-white hover:bg-neutral-900/60 border border-transparent'"
             :title="sidebarCollapsed ? 'Kameralar' : ''">
            <div class="w-9 h-9 flex items-center justify-center flex-shrink-0">
                <i class="fas fa-video text-sm"></i>
            </div>
            <span x-show="!sidebarCollapsed" class="ml-2 text-xs whitespace-nowrap overflow-hidden">Kameralar</span>
        </div>

        <!-- Hisobotlar -->
        <div @click="activeTab = 'reports'; if (window.innerWidth < 768) sidebarOpenMobile = false"
             class="sidebar-item flex items-center h-9 rounded-xl cursor-pointer transition-all duration-150 overflow-hidden"
             :class="activeTab === 'reports' ? 'bg-neutral-900 text-white border border-neutral-800 font-semibold' : 'text-neutral-400 hover:text-white hover:bg-neutral-900/60 border border-transparent'"
             :title="sidebarCollapsed ? 'Hisobotlar' : ''">
            <div class="w-9 h-9 flex items-center justify-center flex-shrink-0">
                <i class="fas fa-chart-bar text-sm"></i>
            </div>
            <span x-show="!sidebarCollapsed" class="ml-2 text-xs whitespace-nowrap overflow-hidden">Hisobotlar</span>
        </div>

        <!-- Bildirishnomalar -->
        <div @click="activeTab = 'notifications'; if (window.innerWidth < 768) sidebarOpenMobile = false"
             class="sidebar-item flex items-center h-9 rounded-xl cursor-pointer transition-all duration-150 overflow-hidden"
             :class="activeTab === 'notifications' ? 'bg-neutral-900 text-white border border-neutral-800 font-semibold' : 'text-neutral-400 hover:text-white hover:bg-neutral-900/60 border border-transparent'"
             :title="sidebarCollapsed ? 'Bildirishnomalar' : ''">
            <div class="w-9 h-9 flex items-center justify-center flex-shrink-0">
                <i class="fas fa-bell text-sm"></i>
            </div>
            <span x-show="!sidebarCollapsed" class="ml-2 text-xs whitespace-nowrap overflow-hidden">Bildirishnomalar</span>
        </div>

        <div class="border-t border-neutral-800/80 my-2 mx-1"></div>

        <!-- Sozlamalar -->
        <div @click="activeTab = 'settings'; if (window.innerWidth < 768) sidebarOpenMobile = false"
             class="sidebar-item flex items-center h-9 rounded-xl cursor-pointer transition-all duration-150 overflow-hidden"
             :class="activeTab === 'settings' ? 'bg-neutral-900 text-white border border-neutral-800 font-semibold' : 'text-neutral-400 hover:text-white hover:bg-neutral-900/60 border border-transparent'"
             :title="sidebarCollapsed ? 'Sozlamalar' : ''">
            <div class="w-9 h-9 flex items-center justify-center flex-shrink-0">
                <i class="fas fa-gear text-sm"></i>
            </div>
            <span x-show="!sidebarCollapsed" class="ml-2 text-xs whitespace-nowrap overflow-hidden">Sozlamalar</span>
        </div>
    </nav>

    <!-- Bottom: Supabase Style Pinned Toggle Button -->
    <div class="mt-auto border-t border-neutral-800/80 p-2 flex items-center justify-center flex-shrink-0 bg-black">
        <button @click="toggleSidebar()" 
                class="flex items-center justify-center w-9 h-9 rounded-xl text-neutral-400 hover:text-white hover:bg-neutral-900 border border-neutral-800/80 hover:border-neutral-700 transition cursor-pointer flex-shrink-0 select-none"
                :title="sidebarCollapsed ? 'Panelni kengaytirish' : 'Panelni yig\'ish'">
            <svg class="w-4.5 h-4.5 text-neutral-300 transition-transform duration-300 ease-in-out"
                 :style="sidebarCollapsed ? 'transform: rotateY(180deg);' : 'transform: rotateY(0deg);'"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="5" />
                <line x1="8.5" y1="7.5" x2="8.5" y2="16.5" stroke-width="2.5" stroke-linecap="round" />
            </svg>
        </button>
    </div>
</aside>
