<!-- SIDEBAR COMPONENT -->
<aside :class="[sidebarCollapsed ? 'w-20' : 'w-[260px]', sidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0']"
       class="fixed left-0 top-0 h-screen bg-black border-r border-neutral-800 z-30 flex flex-col transition-all duration-300 select-none overflow-hidden no-scrollbar">

    <!-- Logo Area with Toggle -->
    <div class="flex items-center justify-between px-3.5 py-4 border-b border-neutral-800 flex-shrink-0">
        <div class="flex items-center gap-3 min-w-0" :class="sidebarCollapsed ? 'justify-center w-full' : ''">
            <div @click="toggleSidebar()" 
                 class="flex-shrink-0 w-10 h-10 bg-neutral-900 rounded-xl flex items-center justify-center border border-neutral-800 cursor-pointer hover:border-neutral-700 hover:scale-105 transition"
                 :title="sidebarCollapsed ? 'Yon panelni ochish' : 'EDUGATE'">
                <span class="text-white font-extrabold text-lg">E</span>
            </div>
            <div x-show="!sidebarCollapsed" x-transition class="min-w-0">
                <h2 class="text-white font-extrabold text-base leading-tight truncate">EDUGATE</h2>
                <p class="text-neutral-500 text-[10px] leading-tight truncate">Hokimlik & MMTV Yagona Markazi</p>
            </div>
        </div>

        <!-- Desktop Collapse Button -->
        <button x-show="!sidebarCollapsed" @click="toggleSidebar()" 
                class="hidden md:flex items-center justify-center w-7 h-7 rounded-lg text-neutral-400 hover:text-white hover:bg-neutral-900 transition cursor-pointer"
                title="Yon panelni yopish (kichraytirish)">
            <i class="fas fa-angles-left text-xs"></i>
        </button>
    </div>

    <!-- Navigation Menu (Scrollbar Completely Disabled) -->
    <nav class="flex-1 overflow-y-auto overflow-x-hidden px-3 py-3 space-y-0.5 no-scrollbar">
        <!-- Global Search Button in Sidebar -->
        <button @click="openGlobalSearch()" 
                class="w-full flex items-center gap-3 px-3 py-2 rounded-xl bg-neutral-900/90 hover:bg-neutral-800 text-neutral-400 hover:text-white border border-neutral-800 hover:border-neutral-700 transition cursor-pointer mb-2.5 group"
                :class="sidebarCollapsed ? 'justify-center px-2' : ''"
                title="Tizim bo'yicha global qidiruv (Ctrl+K)">
            <i class="fas fa-magnifying-glass text-xs text-indigo-400 group-hover:scale-110 transition-transform"></i>
            <span x-show="!sidebarCollapsed" class="text-xs font-medium flex-1 text-left">Global Qidiruv...</span>
            <kbd x-show="!sidebarCollapsed" class="hidden sm:inline-block px-1.5 py-0.5 text-[10px] font-mono text-neutral-400 bg-neutral-800 rounded border border-neutral-700">Ctrl+K</kbd>
        </button>

        <!-- Main Group -->
        <div @click="activeTab = 'dashboard'; sidebarOpen = false"
             class="sidebar-item" :class="{'active': activeTab === 'dashboard', 'justify-center px-2': sidebarCollapsed}"
             title="Dashboard">
            <i class="fas fa-chart-pie w-5 text-center text-sm"></i>
            <span x-show="!sidebarCollapsed">Dashboard</span>
        </div>
        <div @click="activeTab = 'schools'; schoolsView = 'schools_list'; sidebarOpen = false"
             class="sidebar-item" :class="{'active': activeTab === 'schools', 'justify-center px-2': sidebarCollapsed}"
             title="Maktablar">
            <i class="fas fa-school w-5 text-center text-sm"></i>
            <span x-show="!sidebarCollapsed">Maktablar</span>
        </div>
        <div @click="activeTab = 'students'; sidebarOpen = false"
             class="sidebar-item" :class="{'active': activeTab === 'students', 'justify-center px-2': sidebarCollapsed}"
             title="O'quvchilar">
            <i class="fas fa-user-graduate w-5 text-center text-sm"></i>
            <span x-show="!sidebarCollapsed">O'quvchilar</span>
        </div>
        <div @click="activeTab = 'teachers'; sidebarOpen = false"
             class="sidebar-item" :class="{'active': activeTab === 'teachers', 'justify-center px-2': sidebarCollapsed}"
             title="O'qituvchilar">
            <i class="fas fa-chalkboard-user w-5 text-center text-sm"></i>
            <span x-show="!sidebarCollapsed">O'qituvchilar</span>
        </div>

        <div class="border-t border-neutral-800/80 my-2"></div>

        <!-- Monitoring Group -->
        <div @click="activeTab = 'attendance'; sidebarOpen = false"
             class="sidebar-item" :class="{'active': activeTab === 'attendance', 'justify-center px-2': sidebarCollapsed}"
             title="Davomat">
            <i class="fas fa-clipboard-check w-5 text-center text-sm"></i>
            <span x-show="!sidebarCollapsed">Davomat</span>
        </div>
        <div @click="activeTab = 'devices'; sidebarOpen = false"
             class="sidebar-item" :class="{'active': activeTab === 'devices', 'justify-center px-2': sidebarCollapsed}"
             title="Kameralar & Turniketlar">
            <i class="fas fa-video w-5 text-center text-sm"></i>
            <span x-show="!sidebarCollapsed">Kameralar</span>
        </div>
        <div @click="activeTab = 'parents'; sidebarOpen = false"
             class="sidebar-item" :class="{'active': activeTab === 'parents', 'justify-center px-2': sidebarCollapsed}"
             title="Ota-onalar">
            <i class="fas fa-users w-5 text-center text-sm"></i>
            <span x-show="!sidebarCollapsed">Ota-onalar</span>
        </div>

        <div class="border-t border-neutral-800/80 my-2"></div>

        <!-- Reports & Settings Group -->
        <div @click="activeTab = 'reports'; sidebarOpen = false"
             class="sidebar-item" :class="{'active': activeTab === 'reports', 'justify-center px-2': sidebarCollapsed}"
             title="Hisobotlar">
            <i class="fas fa-chart-bar w-5 text-center text-sm"></i>
            <span x-show="!sidebarCollapsed">Hisobotlar</span>
        </div>
        <div @click="activeTab = 'settings'; sidebarOpen = false"
             class="sidebar-item" :class="{'active': activeTab === 'settings', 'justify-center px-2': sidebarCollapsed}"
             title="Sozlamalar">
            <i class="fas fa-gear w-5 text-center text-sm"></i>
            <span x-show="!sidebarCollapsed">Sozlamalar</span>
        </div>
    </nav>

    <!-- Bottom Actions: Only Quick Action (Profile & Logout moved to Topbar as requested) -->
    <div class="px-3 pb-3 pt-2 border-t border-neutral-800 flex-shrink-0">
        <button @click="openSchoolModal()"
                class="w-full flex items-center justify-center gap-2 px-3 py-2 bg-neutral-900 hover:bg-neutral-800 text-white rounded-xl text-xs font-semibold border border-neutral-800 hover:border-neutral-700 transition-all cursor-pointer"
                :title="sidebarCollapsed ? 'Yangi Maktab Qo\'shish' : ''">
            <i class="fas fa-plus text-[10px]"></i>
            <span x-show="!sidebarCollapsed">Yangi Maktab</span>
        </button>
    </div>
</aside>
