<!-- SIDEBAR COMPONENT -->
<aside :class="[sidebarCollapsed ? 'collapsed w-20' : 'w-[260px]', sidebarOpenMobile ? 'translate-x-0' : '-translate-x-full md:translate-x-0']"
       class="sidebar-container fixed md:relative left-0 top-0 h-screen bg-black border-r border-neutral-800 z-30 flex flex-col select-none overflow-hidden no-scrollbar flex-shrink-0">

    <!-- Header: Logo, Brand Text, and Toggle Button -->
    <div class="flex items-center h-[52px] border-b border-neutral-800 flex-shrink-0 px-3.5 overflow-hidden">
        <!-- Brand Area (Logo + Text) -->
        <div class="sidebar-brand-area flex items-center gap-2.5 min-w-0 overflow-hidden"
             :class="sidebarCollapsed ? 'opacity-0 max-w-0 pointer-events-none' : 'opacity-100 max-w-[170px]'">
            <div class="flex-shrink-0 w-7 h-7 bg-neutral-900 rounded-lg flex items-center justify-center border border-neutral-800">
                <span class="text-white font-extrabold text-xs">E</span>
            </div>
            <div class="min-w-0 whitespace-nowrap overflow-hidden">
                <h2 class="text-white font-extrabold text-xs leading-tight truncate" x-text="portalTitle">EDUGATE</h2>
                <p class="text-neutral-500 text-[9px] leading-tight truncate" x-text="portalSubtitle">Boshqaruv Markazi</p>
            </div>
        </div>

        <!-- Toggle Button Container -->
        <div class="flex-1 flex" :class="sidebarCollapsed ? 'justify-center' : 'justify-end'">
            <button @click="toggleSidebar()" 
                    class="flex items-center justify-center w-8 h-8 rounded-lg text-neutral-400 hover:text-white hover:bg-neutral-900 border border-neutral-800/80 hover:border-neutral-700 transition-colors cursor-pointer flex-shrink-0 select-none"
                    :title="sidebarCollapsed ? 'Yon panelni ochish' : 'Yon panelni yopish'">
                <svg class="w-4.5 h-4.5 text-neutral-300 transition-transform duration-300 ease-in-out"
                     :class="sidebarCollapsed ? 'rotate-180' : 'rotate-0'"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="5" />
                    <line x1="8.5" y1="7.5" x2="8.5" y2="16.5" stroke-width="2.5" stroke-linecap="round" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Navigation Menu (Scrollbar Completely Disabled) -->
    <nav class="flex-1 overflow-y-auto overflow-x-hidden px-2.5 py-2.5 space-y-1 no-scrollbar">
        <!-- Main Group: Dashboard -->
        <div @click="activeTab = 'dashboard'; if (window.innerWidth < 768) sidebarOpenMobile = false"
             class="sidebar-item flex items-center h-9 px-2.5 rounded-xl cursor-pointer transition-colors overflow-hidden"
             :class="{'active': activeTab === 'dashboard'}"
             :title="sidebarCollapsed ? 'Dashboard' : ''">
            <div class="sidebar-icon-box w-8 flex items-center justify-center flex-shrink-0">
                <i class="fas fa-chart-pie text-sm text-center"></i>
            </div>
            <span class="sidebar-item-label ml-2 text-xs font-medium whitespace-nowrap overflow-hidden"
                  :class="sidebarCollapsed ? 'opacity-0 max-w-0 -translate-x-2' : 'opacity-100 max-w-[160px] translate-x-0'">
                Dashboard
            </span>
        </div>

        <!-- Statistika -->
        <div @click="activeTab = 'stats'; if (window.innerWidth < 768) sidebarOpenMobile = false"
             class="sidebar-item flex items-center h-9 px-2.5 rounded-xl cursor-pointer transition-colors overflow-hidden"
             :class="{'active': activeTab === 'stats'}"
             :title="sidebarCollapsed ? 'Statistika' : ''">
            <div class="sidebar-icon-box w-8 flex items-center justify-center flex-shrink-0">
                <i class="fas fa-chart-line text-sm text-center"></i>
            </div>
            <span class="sidebar-item-label ml-2 text-xs font-medium whitespace-nowrap overflow-hidden"
                  :class="sidebarCollapsed ? 'opacity-0 max-w-0 -translate-x-2' : 'opacity-100 max-w-[160px] translate-x-0'">
                Statistika
            </span>
        </div>

        <!-- Maktablar -->
        <div x-show="!isSchoolAdmin" @click="activeTab = 'schools'; schoolsView = 'schools_list'; if (window.innerWidth < 768) sidebarOpenMobile = false"
             class="sidebar-item flex items-center h-9 px-2.5 rounded-xl cursor-pointer transition-colors overflow-hidden"
             :class="{'active': activeTab === 'schools'}"
             :title="sidebarCollapsed ? 'Maktablar' : ''">
            <div class="sidebar-icon-box w-8 flex items-center justify-center flex-shrink-0">
                <i class="fas fa-school text-sm text-center"></i>
            </div>
            <span class="sidebar-item-label ml-2 text-xs font-medium whitespace-nowrap overflow-hidden"
                  :class="sidebarCollapsed ? 'opacity-0 max-w-0 -translate-x-2' : 'opacity-100 max-w-[160px] translate-x-0'">
                Maktablar
            </span>
        </div>

        <div class="sidebar-separator border-t border-neutral-800/80 my-1.5"></div>

        <!-- Kameralar -->
        <div @click="activeTab = 'devices'; if (window.innerWidth < 768) sidebarOpenMobile = false"
             class="sidebar-item flex items-center h-9 px-2.5 rounded-xl cursor-pointer transition-colors overflow-hidden"
             :class="{'active': activeTab === 'devices'}"
             :title="sidebarCollapsed ? 'Kameralar & Turniketlar' : ''">
            <div class="sidebar-icon-box w-8 flex items-center justify-center flex-shrink-0">
                <i class="fas fa-video text-sm text-center"></i>
            </div>
            <span class="sidebar-item-label ml-2 text-xs font-medium whitespace-nowrap overflow-hidden"
                  :class="sidebarCollapsed ? 'opacity-0 max-w-0 -translate-x-2' : 'opacity-100 max-w-[160px] translate-x-0'">
                Kameralar
            </span>
        </div>

        <!-- Hisobotlar -->
        <div @click="activeTab = 'reports'; if (window.innerWidth < 768) sidebarOpenMobile = false"
             class="sidebar-item flex items-center h-9 px-2.5 rounded-xl cursor-pointer transition-colors overflow-hidden"
             :class="{'active': activeTab === 'reports'}"
             :title="sidebarCollapsed ? 'Hisobotlar' : ''">
            <div class="sidebar-icon-box w-8 flex items-center justify-center flex-shrink-0">
                <i class="fas fa-chart-bar text-sm text-center"></i>
            </div>
            <span class="sidebar-item-label ml-2 text-xs font-medium whitespace-nowrap overflow-hidden"
                  :class="sidebarCollapsed ? 'opacity-0 max-w-0 -translate-x-2' : 'opacity-100 max-w-[160px] translate-x-0'">
                Hisobotlar
            </span>
        </div>

        <!-- Bildirishnomalar -->
        <div @click="activeTab = 'notifications'; if (window.innerWidth < 768) sidebarOpenMobile = false"
             class="sidebar-item flex items-center h-9 px-2.5 rounded-xl cursor-pointer transition-colors overflow-hidden"
             :class="{'active': activeTab === 'notifications'}"
             :title="sidebarCollapsed ? 'Bildirishnomalar' : ''">
            <div class="sidebar-icon-box w-8 flex items-center justify-center flex-shrink-0">
                <i class="fas fa-bell text-sm text-center"></i>
            </div>
            <span class="sidebar-item-label ml-2 text-xs font-medium whitespace-nowrap overflow-hidden"
                  :class="sidebarCollapsed ? 'opacity-0 max-w-0 -translate-x-2' : 'opacity-100 max-w-[160px] translate-x-0'">
                Bildirishnomalar
            </span>
        </div>

        <div class="sidebar-separator border-t border-neutral-800/80 my-1.5"></div>

        <!-- Sozlamalar -->
        <div @click="activeTab = 'settings'; if (window.innerWidth < 768) sidebarOpenMobile = false"
             class="sidebar-item flex items-center h-9 px-2.5 rounded-xl cursor-pointer transition-colors overflow-hidden"
             :class="{'active': activeTab === 'settings'}"
             :title="sidebarCollapsed ? 'Sozlamalar' : ''">
            <div class="sidebar-icon-box w-8 flex items-center justify-center flex-shrink-0">
                <i class="fas fa-gear text-sm text-center"></i>
            </div>
            <span class="sidebar-item-label ml-2 text-xs font-medium whitespace-nowrap overflow-hidden"
                  :class="sidebarCollapsed ? 'opacity-0 max-w-0 -translate-x-2' : 'opacity-100 max-w-[160px] translate-x-0'">
                Sozlamalar
            </span>
        </div>
    </nav>
</aside>
