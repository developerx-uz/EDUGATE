<!-- SIDEBAR COMPONENT -->
<aside :class="[sidebarCollapsed ? 'w-20' : 'w-[260px]', sidebarOpenMobile ? 'translate-x-0' : '-translate-x-full md:translate-x-0']"
       class="sidebar-container fixed left-0 top-0 h-screen bg-black border-r border-neutral-800 z-30 flex flex-col select-none overflow-hidden no-scrollbar">

    <!-- Header: Logo, Brand Text, and Smooth Sliding Toggle Button -->
    <div class="relative flex items-center h-16 border-b border-neutral-800 flex-shrink-0 overflow-hidden px-4">
        <!-- Brand Area (Logo + Text) -->
        <div class="flex items-center gap-3 min-w-0 transition-all duration-200"
             :class="sidebarCollapsed ? 'opacity-0 pointer-events-none' : 'opacity-100'">
            <div class="flex-shrink-0 w-8 h-8 bg-neutral-900 rounded-xl flex items-center justify-center border border-neutral-800">
                <span class="text-white font-extrabold text-sm">E</span>
            </div>
            <div class="min-w-0 whitespace-nowrap overflow-hidden">
                <h2 class="text-white font-extrabold text-sm leading-tight truncate">EDUGATE</h2>
                <p class="text-neutral-500 text-[10px] leading-tight truncate">Hokimlik Markazi</p>
            </div>
        </div>

        <!-- Toggle Button (Smoothly slides between left: 208px and left: 22px) -->
        <button @click="toggleSidebar()" 
                class="sidebar-toggle-btn absolute top-1/2 -translate-y-1/2 flex items-center justify-center w-9 h-9 rounded-xl text-neutral-400 hover:text-white hover:bg-neutral-900 border border-neutral-800/80 hover:border-neutral-700 cursor-pointer"
                :style="sidebarCollapsed ? 'left: 22px;' : 'left: 208px;'"
                :title="sidebarCollapsed ? 'Yon panelni ochish' : 'Yon panelni yopish'">
            <svg class="sidebar-toggle-svg w-5 h-5 text-neutral-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="5" />
                <line class="sidebar-toggle-line" 
                      :style="sidebarCollapsed ? 'transform: rotate(180deg);' : 'transform: rotate(0deg);'"
                      x1="8.5" y1="7.5" x2="8.5" y2="16.5" stroke-width="2.5" stroke-linecap="round" />
            </svg>
        </button>
    </div>

    <!-- Navigation Menu (Scrollbar Completely Disabled) -->
    <nav class="flex-1 overflow-y-auto overflow-x-hidden px-2.5 py-3 space-y-1 no-scrollbar">
        <!-- Global Search Button in Sidebar -->
        <button @click="openGlobalSearch()" 
                class="w-full flex items-center h-10 px-2.5 rounded-xl bg-neutral-900/90 hover:bg-neutral-800 text-neutral-400 hover:text-white border border-neutral-800 hover:border-neutral-700 transition-colors cursor-pointer mb-2 group overflow-hidden"
                :title="sidebarCollapsed ? 'Tizim bo\'yicha global qidiruv (Ctrl+K)' : ''">
            <div class="w-8 flex items-center justify-center flex-shrink-0">
                <i class="fas fa-magnifying-glass text-xs text-indigo-400 group-hover:scale-110 transition-transform"></i>
            </div>
            <span class="sidebar-item-label ml-2 text-xs font-medium whitespace-nowrap overflow-hidden flex-1 text-left"
                  :class="sidebarCollapsed ? 'opacity-0 max-w-0 -translate-x-2' : 'opacity-100 max-w-[130px] translate-x-0'">
                Global Qidiruv...
            </span>
            <kbd class="sidebar-item-label hidden sm:inline-block px-1.5 py-0.5 text-[10px] font-mono text-neutral-400 bg-neutral-800 rounded border border-neutral-700"
                 :class="sidebarCollapsed ? 'opacity-0 max-w-0' : 'opacity-100'">
                Ctrl+K
            </kbd>
        </button>

        <!-- Main Group -->
        <div @click="activeTab = 'dashboard'; if (window.innerWidth < 768) sidebarOpenMobile = false"
             class="sidebar-item flex items-center h-10 px-2.5 rounded-xl cursor-pointer transition-colors overflow-hidden"
             :class="{'active': activeTab === 'dashboard'}"
             :title="sidebarCollapsed ? 'Dashboard' : ''">
            <div class="w-8 flex items-center justify-center flex-shrink-0">
                <i class="fas fa-chart-pie w-5 text-center text-sm"></i>
            </div>
            <span class="sidebar-item-label ml-2 text-xs font-medium whitespace-nowrap overflow-hidden"
                  :class="sidebarCollapsed ? 'opacity-0 max-w-0 -translate-x-2' : 'opacity-100 max-w-[160px] translate-x-0'">
                Dashboard
            </span>
        </div>

        <div @click="activeTab = 'schools'; schoolsView = 'schools_list'; if (window.innerWidth < 768) sidebarOpenMobile = false"
             class="sidebar-item flex items-center h-10 px-2.5 rounded-xl cursor-pointer transition-colors overflow-hidden"
             :class="{'active': activeTab === 'schools'}"
             :title="sidebarCollapsed ? 'Maktablar' : ''">
            <div class="w-8 flex items-center justify-center flex-shrink-0">
                <i class="fas fa-school w-5 text-center text-sm"></i>
            </div>
            <span class="sidebar-item-label ml-2 text-xs font-medium whitespace-nowrap overflow-hidden"
                  :class="sidebarCollapsed ? 'opacity-0 max-w-0 -translate-x-2' : 'opacity-100 max-w-[160px] translate-x-0'">
                Maktablar
            </span>
        </div>

        <div @click="activeTab = 'students'; if (window.innerWidth < 768) sidebarOpenMobile = false"
             class="sidebar-item flex items-center h-10 px-2.5 rounded-xl cursor-pointer transition-colors overflow-hidden"
             :class="{'active': activeTab === 'students'}"
             :title="sidebarCollapsed ? 'O\'quvchilar' : ''">
            <div class="w-8 flex items-center justify-center flex-shrink-0">
                <i class="fas fa-user-graduate w-5 text-center text-sm"></i>
            </div>
            <span class="sidebar-item-label ml-2 text-xs font-medium whitespace-nowrap overflow-hidden"
                  :class="sidebarCollapsed ? 'opacity-0 max-w-0 -translate-x-2' : 'opacity-100 max-w-[160px] translate-x-0'">
                O'quvchilar
            </span>
        </div>

        <div @click="activeTab = 'teachers'; if (window.innerWidth < 768) sidebarOpenMobile = false"
             class="sidebar-item flex items-center h-10 px-2.5 rounded-xl cursor-pointer transition-colors overflow-hidden"
             :class="{'active': activeTab === 'teachers'}"
             :title="sidebarCollapsed ? 'O\'qituvchilar' : ''">
            <div class="w-8 flex items-center justify-center flex-shrink-0">
                <i class="fas fa-chalkboard-user w-5 text-center text-sm"></i>
            </div>
            <span class="sidebar-item-label ml-2 text-xs font-medium whitespace-nowrap overflow-hidden"
                  :class="sidebarCollapsed ? 'opacity-0 max-w-0 -translate-x-2' : 'opacity-100 max-w-[160px] translate-x-0'">
                O'qituvchilar
            </span>
        </div>

        <div class="border-t border-neutral-800/80 my-2"></div>

        <!-- Monitoring Group -->
        <div @click="activeTab = 'attendance'; if (window.innerWidth < 768) sidebarOpenMobile = false"
             class="sidebar-item flex items-center h-10 px-2.5 rounded-xl cursor-pointer transition-colors overflow-hidden"
             :class="{'active': activeTab === 'attendance'}"
             :title="sidebarCollapsed ? 'Davomat' : ''">
            <div class="w-8 flex items-center justify-center flex-shrink-0">
                <i class="fas fa-clipboard-check w-5 text-center text-sm"></i>
            </div>
            <span class="sidebar-item-label ml-2 text-xs font-medium whitespace-nowrap overflow-hidden"
                  :class="sidebarCollapsed ? 'opacity-0 max-w-0 -translate-x-2' : 'opacity-100 max-w-[160px] translate-x-0'">
                Davomat
            </span>
        </div>

        <div @click="activeTab = 'devices'; if (window.innerWidth < 768) sidebarOpenMobile = false"
             class="sidebar-item flex items-center h-10 px-2.5 rounded-xl cursor-pointer transition-colors overflow-hidden"
             :class="{'active': activeTab === 'devices'}"
             :title="sidebarCollapsed ? 'Kameralar & Turniketlar' : ''">
            <div class="w-8 flex items-center justify-center flex-shrink-0">
                <i class="fas fa-video w-5 text-center text-sm"></i>
            </div>
            <span class="sidebar-item-label ml-2 text-xs font-medium whitespace-nowrap overflow-hidden"
                  :class="sidebarCollapsed ? 'opacity-0 max-w-0 -translate-x-2' : 'opacity-100 max-w-[160px] translate-x-0'">
                Kameralar
            </span>
        </div>

        <div @click="activeTab = 'parents'; if (window.innerWidth < 768) sidebarOpenMobile = false"
             class="sidebar-item flex items-center h-10 px-2.5 rounded-xl cursor-pointer transition-colors overflow-hidden"
             :class="{'active': activeTab === 'parents'}"
             :title="sidebarCollapsed ? 'Ota-onalar' : ''">
            <div class="w-8 flex items-center justify-center flex-shrink-0">
                <i class="fas fa-users w-5 text-center text-sm"></i>
            </div>
            <span class="sidebar-item-label ml-2 text-xs font-medium whitespace-nowrap overflow-hidden"
                  :class="sidebarCollapsed ? 'opacity-0 max-w-0 -translate-x-2' : 'opacity-100 max-w-[160px] translate-x-0'">
                Ota-onalar
            </span>
        </div>

        <div class="border-t border-neutral-800/80 my-2"></div>

        <!-- Reports & Settings Group -->
        <div @click="activeTab = 'reports'; if (window.innerWidth < 768) sidebarOpenMobile = false"
             class="sidebar-item flex items-center h-10 px-2.5 rounded-xl cursor-pointer transition-colors overflow-hidden"
             :class="{'active': activeTab === 'reports'}"
             :title="sidebarCollapsed ? 'Hisobotlar' : ''">
            <div class="w-8 flex items-center justify-center flex-shrink-0">
                <i class="fas fa-chart-bar w-5 text-center text-sm"></i>
            </div>
            <span class="sidebar-item-label ml-2 text-xs font-medium whitespace-nowrap overflow-hidden"
                  :class="sidebarCollapsed ? 'opacity-0 max-w-0 -translate-x-2' : 'opacity-100 max-w-[160px] translate-x-0'">
                Hisobotlar
            </span>
        </div>

        <div @click="activeTab = 'settings'; if (window.innerWidth < 768) sidebarOpenMobile = false"
             class="sidebar-item flex items-center h-10 px-2.5 rounded-xl cursor-pointer transition-colors overflow-hidden"
             :class="{'active': activeTab === 'settings'}"
             :title="sidebarCollapsed ? 'Sozlamalar' : ''">
            <div class="w-8 flex items-center justify-center flex-shrink-0">
                <i class="fas fa-gear w-5 text-center text-sm"></i>
            </div>
            <span class="sidebar-item-label ml-2 text-xs font-medium whitespace-nowrap overflow-hidden"
                  :class="sidebarCollapsed ? 'opacity-0 max-w-0 -translate-x-2' : 'opacity-100 max-w-[160px] translate-x-0'">
                Sozlamalar
            </span>
        </div>
    </nav>
</aside>
