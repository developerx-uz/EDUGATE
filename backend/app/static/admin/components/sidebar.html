<!-- SIDEBAR COMPONENT -->
<aside :class="[sidebarCollapsed ? 'w-20' : 'w-[260px]', sidebarOpenMobile ? 'translate-x-0' : '-translate-x-full md:translate-x-0']"
       class="fixed left-0 top-0 h-screen bg-black border-r border-neutral-800 z-30 flex flex-col transition-[width] duration-300 select-none overflow-hidden no-scrollbar">

    <!-- Header: Logo, Brand Text, and Toggle Button -->
    <div class="flex items-center px-3.5 py-4 border-b border-neutral-800 flex-shrink-0 h-[68px]"
         :class="sidebarCollapsed ? 'justify-center' : 'justify-between'">

        <!-- Brand Logo & Text when expanded -->
        <div x-show="!sidebarCollapsed" class="flex items-center gap-3 min-w-0">
            <!-- Brand Logo Box (E) -->
            <div class="flex-shrink-0 w-9 h-9 bg-neutral-900 rounded-xl flex items-center justify-center border border-neutral-800">
                <span class="text-white font-extrabold text-base">E</span>
            </div>
            <!-- Brand Text -->
            <div class="min-w-0">
                <h2 class="text-white font-extrabold text-sm leading-tight truncate">EDUGATE</h2>
                <p class="text-neutral-500 text-[10px] leading-tight truncate">Hokimlik Markazi</p>
            </div>
        </div>

        <!-- Toggle Button (Both Open & Close with Animated Inner Line) -->
        <button @click="toggleSidebar()" 
                class="flex items-center justify-center w-9 h-9 rounded-xl text-neutral-400 hover:text-white hover:bg-neutral-900 border border-neutral-800/80 hover:border-neutral-700 transition cursor-pointer flex-shrink-0"
                :title="sidebarCollapsed ? 'Yon panelni ochish' : 'Yon panelni yopish'">
            <svg class="sidebar-toggle-svg w-5 h-5 text-neutral-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="5" />
                <line class="sidebar-toggle-line" 
                      :style="sidebarCollapsed ? 'transform: rotate(180deg);' : 'transform: rotate(0deg);'"
                      x1="8.5" y1="7.5" x2="8.5" y2="16.5" stroke-width="2.5" stroke-linecap="round" />
            </svg>
        </button>
    </div>

    <!-- Navigation Menu (Scrollbar Completely Disabled) -->
    <nav class="flex-1 overflow-y-auto overflow-x-hidden px-2.5 py-3 space-y-1 no-scrollbar">
        <!-- Global Search Button in Sidebar -->
        <button @click="openGlobalSearch()" 
                class="w-full flex items-center gap-3 px-3 py-2 rounded-xl bg-neutral-900/90 hover:bg-neutral-800 text-neutral-400 hover:text-white border border-neutral-800 hover:border-neutral-700 transition cursor-pointer mb-2.5 group"
                :class="sidebarCollapsed ? 'justify-center px-0' : ''"
                title="Tizim bo'yicha global qidiruv (Ctrl+K)">
            <i class="fas fa-magnifying-glass text-xs text-indigo-400 group-hover:scale-110 transition-transform"></i>
            <span x-show="!sidebarCollapsed" class="text-xs font-medium flex-1 text-left truncate">Global Qidiruv...</span>
            <kbd x-show="!sidebarCollapsed" class="hidden sm:inline-block px-1.5 py-0.5 text-[10px] font-mono text-neutral-400 bg-neutral-800 rounded border border-neutral-700">Ctrl+K</kbd>
        </button>

        <!-- Main Group -->
        <div @click="activeTab = 'dashboard'; if (window.innerWidth < 768) sidebarOpenMobile = false"
             class="sidebar-item" :class="{'active': activeTab === 'dashboard', 'justify-center px-0': sidebarCollapsed}"
             title="Dashboard">
            <i class="fas fa-chart-pie w-5 text-center text-sm"></i>
            <span x-show="!sidebarCollapsed" class="truncate">Dashboard</span>
        </div>
        <div @click="activeTab = 'schools'; schoolsView = 'schools_list'; if (window.innerWidth < 768) sidebarOpenMobile = false"
             class="sidebar-item" :class="{'active': activeTab === 'schools', 'justify-center px-0': sidebarCollapsed}"
             title="Maktablar">
            <i class="fas fa-school w-5 text-center text-sm"></i>
            <span x-show="!sidebarCollapsed" class="truncate">Maktablar</span>
        </div>
        <div @click="activeTab = 'students'; if (window.innerWidth < 768) sidebarOpenMobile = false"
             class="sidebar-item" :class="{'active': activeTab === 'students', 'justify-center px-0': sidebarCollapsed}"
             title="O'quvchilar">
            <i class="fas fa-user-graduate w-5 text-center text-sm"></i>
            <span x-show="!sidebarCollapsed" class="truncate">O'quvchilar</span>
        </div>
        <div @click="activeTab = 'teachers'; if (window.innerWidth < 768) sidebarOpenMobile = false"
             class="sidebar-item" :class="{'active': activeTab === 'teachers', 'justify-center px-0': sidebarCollapsed}"
             title="O'qituvchilar">
            <i class="fas fa-chalkboard-user w-5 text-center text-sm"></i>
            <span x-show="!sidebarCollapsed" class="truncate">O'qituvchilar</span>
        </div>

        <div class="border-t border-neutral-800/80 my-2"></div>

        <!-- Monitoring Group -->
        <div @click="activeTab = 'attendance'; if (window.innerWidth < 768) sidebarOpenMobile = false"
             class="sidebar-item" :class="{'active': activeTab === 'attendance', 'justify-center px-0': sidebarCollapsed}"
             title="Davomat">
            <i class="fas fa-clipboard-check w-5 text-center text-sm"></i>
            <span x-show="!sidebarCollapsed" class="truncate">Davomat</span>
        </div>
        <div @click="activeTab = 'devices'; if (window.innerWidth < 768) sidebarOpenMobile = false"
             class="sidebar-item" :class="{'active': activeTab === 'devices', 'justify-center px-0': sidebarCollapsed}"
             title="Kameralar & Turniketlar">
            <i class="fas fa-video w-5 text-center text-sm"></i>
            <span x-show="!sidebarCollapsed" class="truncate">Kameralar</span>
        </div>
        <div @click="activeTab = 'parents'; if (window.innerWidth < 768) sidebarOpenMobile = false"
             class="sidebar-item" :class="{'active': activeTab === 'parents', 'justify-center px-0': sidebarCollapsed}"
             title="Ota-onalar">
            <i class="fas fa-users w-5 text-center text-sm"></i>
            <span x-show="!sidebarCollapsed" class="truncate">Ota-onalar</span>
        </div>

        <div class="border-t border-neutral-800/80 my-2"></div>

        <!-- Reports & Settings Group -->
        <div @click="activeTab = 'reports'; if (window.innerWidth < 768) sidebarOpenMobile = false"
             class="sidebar-item" :class="{'active': activeTab === 'reports', 'justify-center px-0': sidebarCollapsed}"
             title="Hisobotlar">
            <i class="fas fa-chart-bar w-5 text-center text-sm"></i>
            <span x-show="!sidebarCollapsed" class="truncate">Hisobotlar</span>
        </div>
        <div @click="activeTab = 'settings'; if (window.innerWidth < 768) sidebarOpenMobile = false"
             class="sidebar-item" :class="{'active': activeTab === 'settings', 'justify-center px-0': sidebarCollapsed}"
             title="Sozlamalar">
            <i class="fas fa-gear w-5 text-center text-sm"></i>
            <span x-show="!sidebarCollapsed" class="truncate">Sozlamalar</span>
        </div>
    </nav>
</aside>
