<!-- SIDEBAR COMPONENT -->
<aside :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'"
       class="fixed left-0 top-0 h-screen w-[260px] bg-black border-r border-neutral-800 z-30 flex flex-col transition-transform duration-300 select-none overflow-hidden no-scrollbar">

    <!-- Header: Logo, Brand Text, and Close Button -->
    <div class="flex items-center justify-between px-3.5 py-4 border-b border-neutral-800 flex-shrink-0">
        <div class="flex items-center gap-3 min-w-0">
            <!-- Brand Logo Box (E) -->
            <div class="flex-shrink-0 w-10 h-10 bg-neutral-900 rounded-xl flex items-center justify-center border border-neutral-800">
                <span class="text-white font-extrabold text-lg">E</span>
            </div>
            <!-- Brand Text -->
            <div class="min-w-0">
                <h2 class="text-white font-extrabold text-base leading-tight truncate">EDUGATE</h2>
                <p class="text-neutral-500 text-[10px] leading-tight truncate">Hokimlik & MMTV Yagona Markazi</p>
            </div>
        </div>

        <!-- Close Button (Yon panelni yopish) -->
        <button @click="toggleSidebar()" 
                class="flex items-center justify-center w-8 h-8 rounded-xl text-neutral-400 hover:text-white hover:bg-neutral-900 border border-neutral-800/60 hover:border-neutral-700 transition cursor-pointer flex-shrink-0"
                title="Yon panelni yopish">
            <svg class="sidebar-toggle-svg w-5 h-5 text-neutral-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="5" />
                <line class="sidebar-toggle-line" 
                      :style="sidebarOpen ? 'transform: rotate(0deg);' : 'transform: rotate(180deg);'"
                      x1="8.5" y1="7.5" x2="8.5" y2="16.5" stroke-width="2.5" stroke-linecap="round" />
            </svg>
        </button>
    </div>

    <!-- Navigation Menu (Scrollbar Completely Disabled) -->
    <nav class="flex-1 overflow-y-auto overflow-x-hidden px-3 py-3 space-y-0.5 no-scrollbar">
        <!-- Global Search Button in Sidebar -->
        <button @click="openGlobalSearch()" 
                class="w-full flex items-center gap-3 px-3 py-2 rounded-xl bg-neutral-900/90 hover:bg-neutral-800 text-neutral-400 hover:text-white border border-neutral-800 hover:border-neutral-700 transition cursor-pointer mb-2.5 group"
                title="Tizim bo'yicha global qidiruv (Ctrl+K)">
            <i class="fas fa-magnifying-glass text-xs text-indigo-400 group-hover:scale-110 transition-transform"></i>
            <span class="text-xs font-medium flex-1 text-left">Global Qidiruv...</span>
            <kbd class="hidden sm:inline-block px-1.5 py-0.5 text-[10px] font-mono text-neutral-400 bg-neutral-800 rounded border border-neutral-700">Ctrl+K</kbd>
        </button>

        <!-- Main Group -->
        <div @click="activeTab = 'dashboard'; if (window.innerWidth < 1024) sidebarOpen = false"
             class="sidebar-item" :class="{'active': activeTab === 'dashboard'}"
             title="Dashboard">
            <i class="fas fa-chart-pie w-5 text-center text-sm"></i>
            <span>Dashboard</span>
        </div>
        <div @click="activeTab = 'schools'; schoolsView = 'schools_list'; if (window.innerWidth < 1024) sidebarOpen = false"
             class="sidebar-item" :class="{'active': activeTab === 'schools'}"
             title="Maktablar">
            <i class="fas fa-school w-5 text-center text-sm"></i>
            <span>Maktablar</span>
        </div>
        <div @click="activeTab = 'students'; if (window.innerWidth < 1024) sidebarOpen = false"
             class="sidebar-item" :class="{'active': activeTab === 'students'}"
             title="O'quvchilar">
            <i class="fas fa-user-graduate w-5 text-center text-sm"></i>
            <span>O'quvchilar</span>
        </div>
        <div @click="activeTab = 'teachers'; if (window.innerWidth < 1024) sidebarOpen = false"
             class="sidebar-item" :class="{'active': activeTab === 'teachers'}"
             title="O'qituvchilar">
            <i class="fas fa-chalkboard-user w-5 text-center text-sm"></i>
            <span>O'qituvchilar</span>
        </div>

        <div class="border-t border-neutral-800/80 my-2"></div>

        <!-- Monitoring Group -->
        <div @click="activeTab = 'attendance'; if (window.innerWidth < 1024) sidebarOpen = false"
             class="sidebar-item" :class="{'active': activeTab === 'attendance'}"
             title="Davomat">
            <i class="fas fa-clipboard-check w-5 text-center text-sm"></i>
            <span>Davomat</span>
        </div>
        <div @click="activeTab = 'devices'; if (window.innerWidth < 1024) sidebarOpen = false"
             class="sidebar-item" :class="{'active': activeTab === 'devices'}"
             title="Kameralar & Turniketlar">
            <i class="fas fa-video w-5 text-center text-sm"></i>
            <span>Kameralar</span>
        </div>
        <div @click="activeTab = 'parents'; if (window.innerWidth < 1024) sidebarOpen = false"
             class="sidebar-item" :class="{'active': activeTab === 'parents'}"
             title="Ota-onalar">
            <i class="fas fa-users w-5 text-center text-sm"></i>
            <span>Ota-onalar</span>
        </div>

        <div class="border-t border-neutral-800/80 my-2"></div>

        <!-- Reports & Settings Group -->
        <div @click="activeTab = 'reports'; if (window.innerWidth < 1024) sidebarOpen = false"
             class="sidebar-item" :class="{'active': activeTab === 'reports'}"
             title="Hisobotlar">
            <i class="fas fa-chart-bar w-5 text-center text-sm"></i>
            <span>Hisobotlar</span>
        </div>
        <div @click="activeTab = 'settings'; if (window.innerWidth < 1024) sidebarOpen = false"
             class="sidebar-item" :class="{'active': activeTab === 'settings'}"
             title="Sozlamalar">
            <i class="fas fa-gear w-5 text-center text-sm"></i>
            <span>Sozlamalar</span>
        </div>
    </nav>
</aside>
