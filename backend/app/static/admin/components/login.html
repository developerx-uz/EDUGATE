<!-- MINIMALIST CLEAN FULLSCREEN LOGIN (ZERO SCROLL) -->
<div x-show="!token" x-cloak 
     class="fixed inset-0 z-50 flex flex-col justify-between bg-[#090d16] text-slate-100 overflow-hidden select-none p-6">
    
    <!-- Top Bar: Minimal Brand & Fullscreen Toggle -->
    <div class="w-full flex items-center justify-between">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-lg bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400">
                <i class="fas fa-building-columns text-sm"></i>
            </div>
            <span class="text-sm font-bold tracking-wider text-white">EDUGATE</span>
        </div>

        <button type="button" @click="toggleFullscreen()"
                class="px-2.5 py-1.5 text-slate-400 hover:text-white hover:bg-slate-800/80 rounded-lg transition text-xs flex items-center gap-1.5 border border-transparent hover:border-slate-700 cursor-pointer">
            <i :class="isFullscreen ? 'fas fa-compress' : 'fas fa-expand'"></i>
            <span class="text-[11px] font-medium" x-text="isFullscreen ? 'Kichik ekran' : 'To\'liq ekran'"></span>
        </button>
    </div>

    <!-- Center: Clean Minimal Login Box -->
    <div class="w-full max-w-sm mx-auto my-auto">
        <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-8 backdrop-blur-sm shadow-xl">
            <!-- Header -->
            <div class="mb-6">
                <h1 class="text-xl font-bold text-white tracking-tight">Tizimga kirish</h1>
                <p class="text-xs text-slate-400 mt-1">Admin boshqaruv paneliga kirish</p>
            </div>

            <!-- Form -->
            <form @submit.prevent="login()" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5">Foydalanuvchi nomi</label>
                    <input type="text" x-model="loginForm.username" required placeholder="admin"
                           class="w-full px-3.5 py-2.5 bg-slate-800/60 border border-slate-700/80 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500 transition">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5">Parol</label>
                    <div class="relative">
                        <input :type="showPassword ? 'text' : 'password'" x-model="loginForm.password" required placeholder="••••••••"
                               class="w-full px-3.5 pr-10 py-2.5 bg-slate-800/60 border border-slate-700/80 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500 transition">
                        <button type="button" @click="showPassword = !showPassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200 transition cursor-pointer">
                            <i :class="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'" class="text-xs"></i>
                        </button>
                    </div>
                </div>

                <!-- Error message -->
                <div x-show="authError" class="p-2.5 bg-rose-500/10 border border-rose-500/20 rounded-xl text-rose-400 text-xs flex items-center gap-2" x-cloak>
                    <i class="fas fa-circle-exclamation"></i>
                    <span x-text="authError"></span>
                </div>

                <!-- Submit Button -->
                <button type="submit" :disabled="loading"
                        class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl transition flex items-center justify-center gap-2 text-sm disabled:opacity-50 cursor-pointer shadow-sm">
                    <i x-show="loading" class="fas fa-circle-notch fa-spin text-xs"></i>
                    <span>Kirish</span>
                </button>
            </form>
        </div>
    </div>

    <!-- Bottom: Minimal Muted Footer -->
    <div class="w-full text-center text-[11px] text-slate-500">
        <span>EDUGATE © 2026</span>
    </div>
</div>
