<!-- LOGIN MODAL COMPONENT -->
<div x-show="!token" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950">
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-40 -right-40 w-96 h-96 bg-indigo-600/10 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-purple-600/10 rounded-full blur-3xl"></div>
    </div>

    <div class="relative glass-card rounded-3xl p-10 w-full max-w-md mx-4 shadow-2xl border border-slate-800">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-600/20 rounded-2xl mb-4 border border-indigo-500/30">
                <i class="fas fa-building-columns text-3xl text-indigo-400"></i>
            </div>
            <h1 class="text-3xl font-extrabold text-white tracking-tight">EDUGATE</h1>
            <p class="text-slate-400 text-xs mt-1 uppercase tracking-wider font-semibold">Viloyat va Shahar Hokimligi Boshqaruv Markazi</p>
        </div>

        <!-- Login Form -->
        <form @submit.prevent="login()" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Foydalanuvchi nomi</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500"><i class="fas fa-user text-sm"></i></span>
                    <input type="text" x-model="loginForm.username" required placeholder="admin"
                           class="w-full pl-10 pr-4 py-3 bg-slate-800/80 border border-slate-700/80 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Parol</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500"><i class="fas fa-lock text-sm"></i></span>
                    <input :type="showPassword ? 'text' : 'password'" x-model="loginForm.password" required placeholder="••••••••"
                           class="w-full pl-10 pr-10 py-3 bg-slate-800/80 border border-slate-700/80 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
                    <button type="button" @click="showPassword = !showPassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 transition">
                        <i :class="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'" class="text-sm"></i>
                    </button>
                </div>
            </div>

            <div x-show="authError" class="p-3 bg-rose-500/10 border border-rose-500/20 rounded-xl text-rose-400 text-xs flex items-center gap-2">
                <i class="fas fa-triangle-exclamation"></i>
                <span x-text="authError"></span>
            </div>

            <button type="submit" :disabled="loading"
                    class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition flex items-center justify-center gap-2 text-sm disabled:opacity-50">
                <i x-show="loading" class="fas fa-circle-notch fa-spin"></i>
                <span>Tizimga kirish</span>
            </button>
        </form>
    </div>
</div>
